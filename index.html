<script>
/* =========================================================================
   SITE — everything school- and unit-specific that is NOT lesson content.
   Change these values and the whole site re-brands: banner, worksheets,
   printables, PowerPoint exports and file names.
   This is the TEACHER edition: there is no passcode and no student view.
   ========================================================================= */
var SITE = {
 "school": "Waiheke High School",
 "schoolShort": "WHS",
 "year": "Year 7",
 "subject": "Social Sciences",
 "strand": "Civics",
 "unitTitle": "Civics and Society",
 "unitBanner": "Who Runs This Place?",
 "unitBlurb": "16 lessons + 3 assessment lessons · Term 3 · 60-minute lessons",
 "lessonMinutes": 60,
 "version": "v1.0",
 "overview": "Students will explore how democracies function through active civic participation and local government. They will investigate local issues, evaluate council responsibilities, and learn how citizens engage to shape their communities.",
 "purpose": "To develop informed, active citizens who understand their local government, recognise the importance of civic responsibility, and can critically evaluate differing perspectives on community challenges and funding.",
 "resChecked": "October 2026",
 "fileStem": "WHS-Y7-Civics",
 "badge": {
  "label": "Waiheke Local Board",
  "value": "5 seats",
  "note": "the last one won by 18 votes"
 },
 "ns": "whs_y7civics_teacher"
};
</script>
<script>
/* =========================================================================
   ENGINE — teacher edition
   Same look, same data shape and the same slideshow / worksheet / PowerPoint
   machinery as the student unit sites, with the student side taken out:
   no passcode, no progress tracking, no on-site activities. Every lesson
   page is a run sheet for the teacher.
   Nothing below needs to change when the unit content changes.
   ========================================================================= */
var STORAGE = {
    dark:   SITE.ns + '_dark',   taught: SITE.ns + '_taught',
    prep:   SITE.ns + '_prep',   lnote:  SITE.ns + '_lnote',
    pane:   SITE.ns + '_pane',   eval:   SITE.ns + '_eval',
    field:  SITE.ns + '_field',  last:   SITE.ns + '_last'
};
var RES_CHECKED = SITE.resChecked;

function siteKicker(){ return SITE.school + ' · ' + SITE.year + ' ' + SITE.subject; }
function siteFile(rest){ return SITE.fileStem + '-' + rest; }
function pad2(n){ return n < 10 ? '0' + n : String(n); }

function ls(k, f) { try { var v = localStorage.getItem(k); return v === null ? f : v; } catch (e) { return f; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function jget(k, f) { try { return JSON.parse(ls(k, JSON.stringify(f))); } catch (e) { return f; } }
function jset(k, v) { lsSet(k, JSON.stringify(v)); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id) { return document.getElementById(id); }
function strip(s){ return String(s === undefined || s === null ? '' : s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&middot;/g,'·').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); }

var notifyTimer = null;
function showNotification(msg, colour) {
    var el = $('notification'); if (!el) return;
    el.textContent = msg;
    el.className = 'fixed bottom-6 right-6 z-[300] px-5 py-3 rounded-lg shadow-2xl font-bold text-sm text-white no-print ' + (colour || 'bg-whs-dark dark:bg-whs-gold dark:text-whs-dark');
    clearTimeout(notifyTimer);
    notifyTimer = setTimeout(function(){ el.className = 'fixed bottom-6 right-6 z-[300] hidden px-5 py-3 rounded-lg shadow-2xl font-bold text-sm text-white no-print'; }, 3200);
}

function initDarkMode() {
    var stored = ls(STORAGE.dark, null), on;
    if (stored === null) {
        var host = document.documentElement.getAttribute('data-theme');
        on = host ? (host === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    } else { on = stored === '1'; }
    document.documentElement.classList.toggle('dark', !!on);
}
function toggleDarkMode() {
    var on = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', on);
    lsSet(STORAGE.dark, on ? '1' : '0');
}
function toggleAccordion(id){ var el = $(id); if (el) el.classList.toggle('hidden'); }

/* ---------- unit lookups ---------- */
var LESSONS = [], LESSON_META = {}, LESSON_TAGS = {}, BOOKWORK = {}, WORKSHEETS = {}, CARDS = {},
    RESOURCES = {}, RES_NOTE = {}, SLIDES = {}, TIMING = {}, PREP = {}, TNOTES = {}, FIGS = {},
    GLOSSARY = {}, DB_ROWS = [], STRAND_LABEL = {}, CURRENT_LESSON = null, CURRENT_VIEW = 'start';

var PHASES = [
    { k:'c', label:'Connect', cls:'ph-c', field:'c' },
    { k:'i', label:'I Do',    cls:'ph-i', field:'i' },
    { k:'w', label:'We Do',   cls:'ph-w', field:'w' },
    { k:'y', label:'You Do',  cls:'ph-y', field:'y' },
    { k:'r', label:'Review',  cls:'ph-r', field:'r' }
];
var PHASE_BY = {}; PHASES.forEach(function(p){ PHASE_BY[p.k] = p; });

function lessonOf(n){ return LESSONS[Number(n) - 1]; }
function lessonTitle(n){ var l = lessonOf(n); return l ? l.t : ('Lesson ' + n); }
function bookTitleFor(n){ return 'Lesson ' + n + ' — ' + lessonTitle(n); }
function hasWorksheet(n){ return !!WORKSHEETS[n]; }
/* where a finished worksheet goes — said the same way on the sheet, the slides and the run sheet */
function wsTwoSided(w){ return /double-sided/i.test((w && w.print) || ''); }
function wsAfter(w, kind){
    if (w.collect) return kind === 'head' ? 'Hand this in at the end' : (kind === 'slide' ? 'Name on the top. Hand it in at the end of the lesson.' : 'Hand it in at the end of the lesson.');
    if (wsTwoSided(w)) return kind === 'head' ? 'Glue in along one edge when finished' : 'Glue it into your book along one edge, so both sides can be read.';
    return kind === 'head' ? 'Glue into your book when finished' : (kind === 'slide' ? 'Glue it into your book when you have finished it.' : 'Fill it in, then glue it into your book.');
}
function hasCards(n){ return !!CARDS[n]; }
function hasBook(n){ return !!BOOKWORK[n]; }

/* ---------- work modes: where the work happens ----------
   Green, orange and purple mean what they mean on the student sites.
   Blue used to be "on the site"; students do not use this site, so blue is
   now "on the board" — the slideshow quiz or anything the class does
   together off the projector. Teal is new: printed cards to cut up.      */
var WORK_MODE = {
    book:  { ico:'📓', label:'Exercise book', short:'Book',      sub:'Write this in your book',          hex:'15803D' },
    sheet: { ico:'📄', label:'Worksheet',     short:'Worksheet', sub:'On the paper worksheet',           hex:'C2410C' },
    cards: { ico:'✂️', label:'Card set',      short:'Cards',     sub:'Printed cards — in pairs or groups', hex:'0F766E' },
    board: { ico:'📺', label:'On the board',  short:'Board',     sub:'Together, off the slideshow',      hex:'1D4ED8' },
    watch: { ico:'▶️', label:'Watch',         short:'Watch',     sub:'Video — eyes on the screen',  hex:'7E22CE' },
    talk:  { ico:'🗣️', label:'Talk',    short:'Talk',      sub:'Discuss — no writing yet',    hex:'475569' },
    out:   { ico:'🧤', label:'Outside',       short:'Outside',   sub:'Fieldwork — follow the safety rules', hex:'B45309' }
};
var MODE_ORDER = ['book','sheet','cards','board','watch','talk','out'];
function modeSplit(x){
    var m = /^\s*(book|sheet|cards|board|watch|talk|out)\s*:\s*/i.exec(String(x));
    return m ? { m:m[1].toLowerCase(), t:String(x).slice(m[0].length) } : { m:null, t:String(x) };
}
function modePill(m){ var w = WORK_MODE[m]; return w ? '<span class="s-pill ' + m + '">' + w.ico + ' ' + w.short + '</span>' : ''; }
function modeChip(m){ var w = WORK_MODE[m]; return w ? '<span class="wm wm-' + m + '">' + w.ico + ' ' + w.short + '</span>' : ''; }
function modeBand(m, sub){
    var w = WORK_MODE[m]; if (!w) return '';
    return '<div class="s-band ' + m + '"><span class="ico">' + w.ico + '</span><span>' + w.label + '</span><span class="sub">' + esc(sub || w.sub) + '</span></div>';
}

/* The task slide is the master list. Everything that says "what goes where"
   — the three tiles on the lesson page, the "where your work goes" slide,
   the print-room table, the unit plan — is read off it, so they cannot
   drift apart.                                                            */
function taskSlide(n){
    var d = SLIDES[n] || [];
    for (var i = 0; i < d.length; i++) if (d[i].k === 'task') return d[i];
    return null;
}
function taskLines(n, modes){
    var t = taskSlide(n); if (!t) return [];
    return (t.body || []).map(modeSplit).filter(function(p){ return !modes || modes.indexOf(p.m) > -1; });
}
function bookAct(n){
    var w = BOOKWORK[n]; if (!w) return '';
    if (w.act) return w.act;
    var lines = taskLines(n, ['book']).map(function(p){ return p.t; });
    return 'Rule off, then write the date and the title. ' + lines.join(' ');
}

/* ---------- navigation ---------- */
var MAIN_TABS = [
    { id:'start',  label:'🧭 Start Here' },
    { id:'print',  label:'🖨️ Print Room' },
    { id:'assess', label:'📝 Assessment' },
    { id:'facts',  label:'📊 Fact File' },
    { id:'words',  label:'🔤 Key Words' },
    { id:'about',  label:'📕 About the Unit' }
];
function renderMainNav(){
    $('main-nav').innerHTML = MAIN_TABS.map(function(t){
        var on = CURRENT_VIEW === t.id && !CURRENT_LESSON;
        return '<button id="tab-' + t.id + '" role="tab" aria-selected="' + (on ? 'true' : 'false') + '" onclick="switchTab(\'' + t.id + '\')" '
            + 'class="nav-btn' + (on ? ' active' : '') + ' px-4 py-2 text-sm rounded-lg font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all text-slate-700 dark:text-slate-200 shadow-sm">'
            + t.label + '</button>';
    }).join('');
}
function setBanner(lean){ var b = $('site-banner'); if (b) b.classList.toggle('lean', !!lean); }
function showView(id){
    document.querySelectorAll('.view-section').forEach(function(s){ s.classList.remove('block'); });
    var v = $('view-' + id); if (v) v.classList.add('block');
}
function switchTab(target) {
    if (DECK.n !== null) closeDeck();
    CURRENT_LESSON = null; CURRENT_VIEW = target;
    showView(target);
    renderMainNav(); renderLessonNav();
    setBanner(target !== 'start');
    if (target === 'start') renderStart();
    if (target === 'print') renderPrint();
    window.scrollTo({ top:0, behavior:'smooth' });
    lsSet(STORAGE.last, target);
}

function taughtList(){ return jget(STORAGE.taught, []); }
function isTaught(n){ return taughtList().indexOf(Number(n)) > -1; }
function toggleTaught(n){
    n = Number(n);
    var t = taughtList(), i = t.indexOf(n);
    if (i > -1) t.splice(i, 1); else t.push(n);
    jset(STORAGE.taught, t);
    renderProgress(); renderLessonNav();
    if (CURRENT_LESSON === n) renderLessonHead(n);
    if (i < 0) showNotification('✓ Lesson ' + n + ' ticked off as taught', 'bg-green-600');
}
function nextUntaught(){
    for (var i = 0; i < LESSONS.length; i++) if (!isTaught(LESSONS[i].n)) return LESSONS[i].n;
    return null;
}
function renderProgress(){
    var done = taughtList().filter(function(n){ return !!lessonOf(n); }).length, total = LESSONS.length;
    $('progress-done').textContent = done; $('progress-total').textContent = total;
    $('progress-bar').style.width = (total ? done / total * 100 : 0) + '%';
    var nx = nextUntaught();
    $('progress-next').textContent = nx ? 'Next up: Lesson ' + nx + ' · ' + lessonTitle(nx) : 'Every lesson taught — ka pai';
}

function renderLessonNav(){
    var sel = $('lesson-select');
    if (sel) sel.innerHTML = '<option value="" disabled' + (CURRENT_LESSON ? '' : ' selected') + '>Choose a lesson …</option>'
        + LESSONS.map(function(l){
            return '<option value="' + l.n + '"' + (CURRENT_LESSON === l.n ? ' selected' : '') + '>Lesson ' + l.n + ' · ' + esc(l.t) + '</option>';
        }).join('');
    var prev = null;
    $('lesson-nav').innerHTML = LESSONS.map(function(l){
        var sep = (prev !== null && prev !== l.strand) ? '<span class="lesson-sep" aria-hidden="true"></span>' : '';
        prev = l.strand;
        return sep + '<button aria-selected="' + (CURRENT_LESSON === l.n ? 'true' : 'false') + '" onclick="switchLesson(' + l.n + ')" '
            + 'title="Lesson ' + l.n + ' · ' + esc(l.t) + (isTaught(l.n) ? ' (taught)' : '') + '" '
            + 'class="lesson-chip' + (isTaught(l.n) ? ' seen done' : '') + (CURRENT_LESSON === l.n ? ' active' : '') + '">' + l.n + '</button>';
    }).join('');
}
function lessonStep(d){
    var i = CURRENT_LESSON ? CURRENT_LESSON - 1 : -1, j = i + d;
    if (d > 0 && i < 0) j = 0;
    if (j < 0 || j >= LESSONS.length) return;
    switchLesson(LESSONS[j].n);
}

function lessonTagsHTML(n){
    return ((LESSON_META[n] || {}).tags || []).map(function(t){
        return LESSON_TAGS[t] ? '<span class="ltag ' + LESSON_TAGS[t].cls + '">' + esc(LESSON_TAGS[t].label) + '</span>' : '';
    }).join('');
}

/* small "what this lesson has" icons, used on the index and in the print room */
function lessonKit(n){
    var k = [];
    if (SLIDES[n]) k.push(['🎬', SLIDES[n].length + ' slides']);
    if (hasWorksheet(n)) k.push(['📄', 'worksheet']);
    if (hasCards(n)) k.push(['✂️', 'card set']);
    if (deckQuizCount(n)) k.push(['❓', deckQuizCount(n) + '-question slide quiz']);
    if (deckVideoCount(n)) k.push(['▶️', 'video']);
    return k;
}
function deckQuizCount(n){ return (SLIDES[n] || []).filter(function(s){ return s.k === 'quiz'; }).length; }
function deckVideoCount(n){ return (SLIDES[n] || []).filter(function(s){ return s.k === 'video'; }).length; }

/* ---------- Start Here ---------- */
function renderStart(){
    var prev = null, groups = [];
    LESSONS.forEach(function(l){
        if (l.strand !== prev) { groups.push({ strand:l.strand, items:[] }); prev = l.strand; }
        groups[groups.length - 1].items.push(l);
    });
    $('lesson-index').innerHTML = groups.map(function(g){
        return '<div><div class="idx-strand">' + esc(STRAND_LABEL[g.strand] || g.strand) + '</div>'
            + '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">'
            + g.items.map(function(l){
                var kit = lessonKit(l.n).map(function(k){ return '<span title="' + esc(k[1]) + '">' + k[0] + '</span>'; }).join(' ');
                return '<button onclick="switchLesson(' + l.n + ')" class="lesson-idx' + (isTaught(l.n) ? ' done' : '') + '">'
                    + '<span class="flex items-baseline gap-2 mb-0.5">'
                    +   '<span class="font-mono font-black text-whs-dark dark:text-whs-gold">' + l.n + '</span>'
                    +   lessonTagsHTML(l.n)
                    +   (isTaught(l.n) ? '<span class="ml-auto text-green-600 dark:text-green-400 text-xs font-bold">✓ taught</span>' : '')
                    + '</span>'
                    + '<span class="block text-sm font-bold text-whs-dark dark:text-whs-light leading-snug">' + esc(l.t) + '</span>'
                    + '<span class="block text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">' + esc((LESSON_META[l.n] || {}).short || '') + '</span>'
                    + '<span class="block text-xs mt-1.5 opacity-80">' + kit + '</span></button>';
              }).join('')
            + '</div></div>';
    }).join('');

    var nx = nextUntaught();
    $('start-next').innerHTML = nx
        ? '<div class="glass-card rounded-xl border-2 border-whs-gold bg-white dark:bg-slate-800 p-5 flex flex-wrap items-center justify-between gap-4">'
          + '<div><div class="text-[10px] font-mono uppercase tracking-widest font-bold text-whs-goldtext dark:text-whs-gold">Your next lesson</div>'
          + '<div class="text-xl font-extrabold text-whs-dark dark:text-whs-light">Lesson ' + nx + ' · ' + esc(lessonTitle(nx)) + '</div>'
          + '<div class="text-sm text-slate-600 dark:text-slate-300 mt-1">' + esc((LESSON_META[nx] || {}).intent || '') + '</div></div>'
          + '<div class="flex flex-wrap gap-2 no-print">'
          +   '<button onclick="switchLesson(' + nx + ')" class="act-check">Open the run sheet</button>'
          +   '<button onclick="openDeck(' + nx + ')" class="act-reset">▶ Present</button>'
          +   '<button onclick="openLessonPack(' + nx + ')" class="act-reset">🖨️ Print the lesson pack</button>'
          + '</div></div>'
        : '';
}

function applyBranding(){
    var set  = function(id, t){ var el = $(id); if (el) el.textContent = t; };
    var html = function(id, t){ var el = $(id); if (el) el.innerHTML = t; };
    document.title = SITE.unitBanner + ' · Teacher site';
    set('brand-kicker', SITE.year + ' ' + SITE.subject + ' · ' + SITE.strand + ' · Teacher site');
    set('brand-title',  SITE.unitBanner);
    set('brand-sub',    UNIT.bannerSub || SITE.unitTitle);
    set('version-badge', SITE.version || 'v1.0');
    if (SITE.badge) {
        var b = $('banner-side');
        if (b) { b.classList.remove('hidden');
            set('banner-side-lab', SITE.badge.label); set('banner-side-val', SITE.badge.value);
            set('banner-side-sub', SITE.badge.note || ''); }
    }
    set('start-kicker', SITE.year + ' ' + SITE.subject + ' · ' + SITE.unitBlurb);
    set('start-title',  SITE.unitBanner);
    set('start-bigq',   UNIT.bigQuestion || '');
    html('start-lead',  UNIT.startLead || '');
    html('start-outcomes', (UNIT.outcomes || []).map(function(o, i){
        return '<li class="flex gap-3"><span class="text-whs-gold font-black">' + pad2(i + 1) + '</span><span>' + o + '</span></li>';
    }).join(''));
    html('start-warnings', (UNIT.teacherWarnings || []).map(function(p){ return '<p>' + p + '</p>'; }).join(''));
    html('start-side', (UNIT.startCards || []).map(function(c){
        var cls = c.style === 'ncea' ? 'ncea-box' : c.style === 'care' ? 'care-box' : 'plain-english-box';
        return '<div class="glass-card bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-300 dark:border-slate-700">'
            + '<h3 class="text-lg font-extrabold mb-2 text-whs-dark dark:text-whs-light">' + esc(c.title) + '</h3>'
            + '<div class="' + cls + ' p-4 rounded-r-lg text-sm text-slate-700 dark:text-slate-300 start-card">' + c.body + '</div></div>';
    }).join(''));
    set('foot-1', SITE.school + ' · ' + SITE.year + ' ' + SITE.subject + ' · ' + SITE.strand + ' — ' + SITE.unitTitle + ' · teacher site ' + (SITE.version || ''));
    set('foot-2', UNIT.footerNote || ('Compiled ' + SITE.resChecked + '.'));
}

function hydrateUnit(){
    LESSONS     = UNIT.lessons       || [];
    LESSON_META = UNIT.meta          || {};
    LESSON_TAGS = UNIT.tags          || {};
    BOOKWORK    = UNIT.bookwork      || {};
    WORKSHEETS  = UNIT.worksheets    || {};
    CARDS       = UNIT.cards         || {};
    RESOURCES   = UNIT.resources     || {};
    RES_NOTE    = UNIT.resourceNotes || {};
    SLIDES      = UNIT.slides        || {};
    TIMING      = UNIT.timing        || {};
    PREP        = UNIT.prep          || {};
    TNOTES      = UNIT.notes         || {};
    FIGS        = UNIT.figs          || {};
    GLOSSARY    = UNIT.glossary      || {};
    DB_ROWS     = UNIT.dataBank      || [];
    STRAND_LABEL= UNIT.strands       || {};
    prepareDecks();
}

/* Give every slide its lesson number and a phase. A slide inherits the phase
   of the one before it, so a deck only has to mark where each phase starts. */
function prepareDecks(){
    Object.keys(SLIDES).forEach(function(key){
        var n = Number(key), ph = 'c';
        SLIDES[n].forEach(function(s){
            s.ln = n;
            if (s.ph) ph = s.ph; else s.ph = ph;
        });
        var first = SLIDES[n][0];
        if (first && first.k === 'title' && !first.n) first.n = lessonPlanNotes(n);
    });
}
function lessonPlanNotes(n){
    var l = lessonOf(n); if (!l) return '';
    var tm = TIMING[n] || {};
    return PHASES.map(function(p){ return p.label.toUpperCase() + (tm[p.k] ? ' (' + tm[p.k] + ' min)' : '') + ': ' + l[p.field]; }).join('  |  ')
        + (l.res ? '  |  PREP: ' + l.res : '');
}
/* which slides belong to which phase — printed on the run sheet */
function phaseSlides(n, k){
    var out = [];
    (SLIDES[n] || []).forEach(function(s, i){ if (s.ph === k) out.push(i + 1); });
    return out;
}
function rangeText(a){
    if (!a.length) return '—';
    var parts = [], s = a[0], p = a[0];
    for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        parts.push(s === p ? String(s) : s + '–' + p);
        s = p = a[i];
    }
    return parts.join(', ');
}


/* =========================================================================
   THE LESSON PAGE — a run sheet, not a student page
   ========================================================================= */
var LPANES = [
    { k:'run',    label:'Run sheet',   ico:'⏱️', cls:'start'  },
    { k:'slides', label:'Slides',      ico:'🎬', cls:'do'     },
    { k:'hand',   label:'Hand-outs',   ico:'📄', cls:'sheet'  },
    { k:'book',   label:'Book work',   ico:'📓', cls:'book'   },
    { k:'keys',   label:'Answers',     ico:'🔑', cls:'learn'  },
    { k:'links',  label:'Links',       ico:'🔗', cls:'deeper' }
];

function switchLesson(n){
    n = Number(n);
    var l = lessonOf(n); if (!l) return;
    if (DECK.n !== null) closeDeck();
    CURRENT_LESSON = n; CURRENT_VIEW = 'lesson';
    showView('lesson');
    setBanner(true);
    renderMainNav(); renderLessonNav();
    renderLessonHead(n);
    buildLessonPanes(n);
    $('lesson-foot').innerHTML = lessonFooterHTML(n);
    window.scrollTo({ top:0, behavior:'smooth' });
    lsSet(STORAGE.last, 'L' + n);
}

function renderLessonHead(n){
    var l = lessonOf(n), taught = isTaught(n);
    $('lesson-head').innerHTML = '<div class="lhead-bar">'
        + '<span class="lhead-n">' + n + '</span>'
        + '<h2 class="lhead-title">' + esc(l.t) + '</h2>'
        + '<span class="lhead-strand">' + esc(STRAND_LABEL[l.strand] || '') + '</span>'
        + lessonTagsHTML(n)
        + '</div>'
        + '<div class="t-actions no-print">'
        +   '<button onclick="openDeck(' + n + ')" class="t-act primary">▶ Present the slides</button>'
        +   '<button onclick="downloadDeck(' + n + ')" class="t-act">⇩ PowerPoint</button>'
        +   (hasWorksheet(n) ? '<button onclick="openWorksheet(' + n + ')" class="t-act sheet">📄 Print the worksheet</button>' : '')
        +   (hasCards(n) ? '<button onclick="openCards(' + n + ')" class="t-act cards">✂️ Print the cards</button>' : '')
        +   '<button onclick="openLessonPack(' + n + ')" class="t-act">🖨️ Whole lesson pack</button>'
        +   '<span class="flex-1"></span>'
        +   '<button onclick="toggleTaught(' + n + ')" class="t-act' + (taught ? ' done' : '') + '">' + (taught ? '✓ Taught — undo' : '☐ Tick off as taught') + '</button>'
        + '</div>';
}

function lessonFooterHTML(n){
    function btn(l, dir){
        if (!l) return '<span></span>';
        return '<button onclick="switchLesson(' + l.n + ')" class="glass-card bg-white dark:bg-slate-800 px-5 py-3 rounded-xl border border-slate-300 dark:border-slate-700 hover:border-whs-gold transition text-left max-w-[19rem]">'
            + '<span class="block text-[10px] font-mono uppercase tracking-widest text-slate-500 dark:text-slate-400 font-bold">' + (dir < 0 ? '‹ Previous' : 'Next ›') + '</span>'
            + '<span class="block text-sm font-bold text-whs-dark dark:text-whs-light">Lesson ' + l.n + ' · ' + esc(l.t) + '</span></button>';
    }
    return '<div class="flex flex-wrap justify-between items-stretch gap-3 mt-10 no-print">' + btn(lessonOf(n - 1), -1) + btn(lessonOf(n + 1), 1) + '</div>';
}

function buildLessonPanes(n){
    var panes = LPANES.filter(function(p){
        if (p.k === 'hand') return hasWorksheet(n) || hasCards(n);
        if (p.k === 'book') return hasBook(n);
        return true;
    });
    $('lesson-tabs').innerHTML = '<div class="ltabs no-print" role="tablist" aria-label="Lesson sections">'
        + '<span class="ltabs-label">Lesson ' + n + '</span>'
        + panes.map(function(p){
            return '<button type="button" class="ltab ' + p.cls + '" id="lpane-tab-' + p.k + '" role="tab" onclick="showLessonPane(\'' + p.k + '\')">'
                + '<span class="ltab-n">' + p.ico + '</span>' + esc(p.label) + '</button>';
        }).join('') + '</div>';
    $('lesson-phases').innerHTML = panes.map(function(p){
        return '<div class="lphase" id="lpane-' + p.k + '" role="tabpanel" aria-label="' + esc(p.label) + '"></div>';
    }).join('');
    var want = ls(STORAGE.pane, 'run');
    if (!$('lpane-' + want)) want = 'run';
    showLessonPane(want, true);
}

var PANE_DRAW = { run:paneRun, slides:paneSlides, hand:paneHand, book:paneBook, keys:paneKeys, links:paneLinks };
function showLessonPane(k, quiet){
    var n = CURRENT_LESSON; if (!n) return;
    LPANES.forEach(function(p){
        var pane = $('lpane-' + p.k), tab = $('lpane-tab-' + p.k);
        if (pane) pane.classList.toggle('on', p.k === k);
        if (tab) { tab.classList.toggle('on', p.k === k); tab.setAttribute('aria-selected', p.k === k ? 'true' : 'false'); }
    });
    var host = $('lpane-' + k);
    if (host && !host.getAttribute('data-drawn')) { host.innerHTML = PANE_DRAW[k](n); host.setAttribute('data-drawn', '1'); afterPane(k, n); }
    lsSet(STORAGE.pane, k);
    if (!quiet) {
        var top = $('lesson-tabs');
        if (top) window.scrollTo({ top: Math.max(0, top.getBoundingClientRect().top + window.scrollY - 130), behavior:'smooth' });
    }
}
function afterPane(k, n){
    if (k === 'run') { loadLessonNote(n); if (UNIT.fieldTool && UNIT.fieldTool.lessons.indexOf(n) > -1) drawFieldTool(); }
    if (k === 'hand') fitFrames();
    if (k === 'slides') fitThumbs();
}
function fitThumbs(){
    document.querySelectorAll('.t-thumb-frame').forEach(function(f){
        var inner = f.querySelector('.t-thumb-inner'); if (inner && f.clientWidth) inner.style.transform = 'scale(' + (f.clientWidth / 1280) + ')';
    });
}

function card(inner, cls){
    return '<div class="glass-card bg-white dark:bg-slate-800 p-5 md:p-6 rounded-xl border ' + (cls || 'border-slate-300 dark:border-slate-700') + '">' + inner + '</div>';
}
function h3(t){ return '<h3 class="text-lg font-extrabold mb-3 text-whs-dark dark:text-whs-light">' + t + '</h3>'; }
function kick(t){ return '<div class="text-[10px] font-mono uppercase tracking-widest text-slate-500 dark:text-slate-400 font-bold mb-2">' + t + '</div>'; }

/* ---------- pane 1: the run sheet ---------- */
function whereTilesHTML(n){
    var ws = WORKSHEETS[n], cs = CARDS[n], bw = BOOKWORK[n];
    var sheetLines = taskLines(n, ['sheet']), cardLines = taskLines(n, ['cards']);
    var together = taskLines(n, ['board','watch','talk','out']);
    var book = bw
        ? '<div class="where-tile book"><h4>📓 Exercise book</h4><p>' + esc(bookAct(n)) + '</p>'
          + ((bw.copy || []).length ? '<p class="mt-1"><em>Plus ' + bw.copy.length + ' notes to copy — they are on the “Copy these notes” slide and under Book work.</em></p>' : '') + '</div>'
        : '<div class="where-tile book none"><h4>📓 Exercise book</h4><p>Nothing in books this lesson.</p></div>';
    var paper = '';
    if (ws || cs) {
        paper = '<div class="where-tile sheet"><h4>📄 On paper</h4>';
        if (ws) paper += '<p><strong>Worksheet: ' + esc(ws.title) + '</strong>' + (ws.collect ? ' <span class="t-flag">collect it in</span>' : '') + '</p>'
            + '<ul>' + sheetLines.map(function(p){ return '<li>' + esc(p.t) + '</li>'; }).join('') + '</ul>';
        if (cs) paper += '<p class="mt-2"><strong>✂️ Card set: ' + esc(cs.title) + '</strong> — ' + esc(cs.per || 'one set per group') + '</p>'
            + '<ul>' + cardLines.map(function(p){ return '<li>' + esc(p.t) + '</li>'; }).join('') + '</ul>';
        paper += '</div>';
    } else {
        paper = '<div class="where-tile sheet none"><h4>📄 On paper</h4><p>Nothing to print for students this lesson.</p></div>';
    }
    var tog = '<div class="where-tile site"><h4>📺 Together, off the slides</h4>'
        + (together.length ? '<ul class="t-plain">' + together.map(function(p){ return '<li>' + modeChip(p.m) + ' ' + esc(p.t) + '</li>'; }).join('') + '</ul>' : '<p>Nothing whole-class beyond the teaching slides.</p>')
        + '</div>';
    return '<div>' + kick('Where the work goes today — read off the task slide') + '<div class="where-grid">' + book + paper + tog + '</div></div>';
}

function timeBarHTML(n){
    var tm = TIMING[n] || {}, total = 0;
    PHASES.forEach(function(p){ total += (tm[p.k] || 0); });
    if (!total) return '';
    return '<div class="t-timebar" aria-hidden="true">' + PHASES.map(function(p){
        var m = tm[p.k] || 0; if (!m) return '';
        return '<span class="' + p.cls + '" style="flex:' + m + '">' + p.label + ' · ' + m + '</span>';
    }).join('') + '</div>';
}

function runTableHTML(n){
    var l = lessonOf(n), tm = TIMING[n] || {}, at = 0;
    var rows = PHASES.map(function(p){
        var m = tm[p.k] || 0, from = at; at += m;
        var sl = phaseSlides(n, p.k);
        return '<div class="t-run-row">'
            + '<div class="t-run-ph"><span class="t-ph ' + p.cls + '">' + p.label + '</span>'
            +   (m ? '<span class="t-min">' + m + ' min</span><span class="t-clock">' + from + '–' + at + '</span>' : '') + '</div>'
            + '<div class="t-run-do">' + esc(l[p.field]) + '</div>'
            + '<div class="t-run-sl">' + (sl.length
                ? '<button class="deck-launch" onclick="openDeck(' + n + ',' + (sl[0] - 1) + ')" title="Present from slide ' + sl[0] + '">▶ Slides ' + rangeText(sl) + '</button>'
                : '<span class="text-xs text-slate-400">no slides</span>') + '</div>'
            + '</div>';
    }).join('');
    return card(
        '<div class="flex flex-wrap items-baseline justify-between gap-2">' + h3('⏱️ Run sheet — ' + (SITE.lessonMinutes || 60) + ' minutes')
        + '<span class="text-xs text-slate-500 dark:text-slate-400">The times are a guide. The slide buttons start the slideshow at that phase.</span></div>'
        + timeBarHTML(n) + '<div class="t-run">' + rows + '</div>');
}

function prepHTML(n){
    var items = PREP[n] || [], ticked = jget(STORAGE.prep, {})[n] || [];
    var l = lessonOf(n);
    return card(h3('🧰 Before the lesson')
        + (items.length
            ? '<ul class="t-prep">' + items.map(function(x, i){
                var on = ticked.indexOf(i) > -1;
                return '<li><label><input type="checkbox" ' + (on ? 'checked ' : '') + 'onchange="togglePrep(' + n + ',' + i + ',this.checked)"><span>' + x + '</span></label></li>';
              }).join('') + '</ul>'
            : '<p class="text-sm text-slate-600 dark:text-slate-300">' + esc(l.res || 'Nothing to prepare.') + '</p>')
        + '<div class="flex flex-wrap gap-2 mt-4 no-print">'
        +   (hasWorksheet(n) ? '<button onclick="openWorksheet(' + n + ')" class="deck-launch">📄 Worksheet</button>' : '')
        +   (hasCards(n) ? '<button onclick="openCards(' + n + ')" class="deck-launch">✂️ Cards</button>' : '')
        +   '<button onclick="openAnswerKey(' + n + ')" class="deck-launch">🔑 Answer key</button>'
        +   '<button onclick="openLessonPlan(' + n + ')" class="deck-launch">📋 One-page plan</button>'
        + '</div>');
}
function togglePrep(n, i, on){
    var all = jget(STORAGE.prep, {}), a = all[n] || [], j = a.indexOf(i);
    if (on && j < 0) a.push(i); if (!on && j > -1) a.splice(j, 1);
    all[n] = a; jset(STORAGE.prep, all);
}

function notesHTML(n){
    var t = TNOTES[n]; if (!t) return '';
    function row(lab, cls, txt){ return txt ? '<div class="t-note ' + cls + '"><strong>' + lab + '</strong><span>' + txt + '</span></div>' : ''; }
    return card(h3('🧭 Teaching notes')
        + row('Watch for', 'warn', t.watch) + row('Support', 'sup', t.support) + row('Extend', 'ext', t.extend) + row('Local', 'loc', t.local));
}

function wordsForLesson(n){
    return Object.keys(GLOSSARY).filter(function(k){ return (GLOSSARY[k].l || []).indexOf(n) > -1 || GLOSSARY[k].l === n; });
}
function wordsHTML(n){
    var w = wordsForLesson(n); if (!w.length) return '';
    return card(h3('🔤 Key words this lesson')
        + '<dl class="t-words">' + w.map(function(k){
            return '<div><dt>' + esc(k) + '</dt><dd>' + esc(GLOSSARY[k].def) + '</dd></div>';
        }).join('') + '</dl>');
}

function lessonNoteHTML(n){
    return card(h3('📝 My notes for next time')
        + '<p class="text-xs text-slate-500 dark:text-slate-400 mb-2">Saved on this device only.</p>'
        + '<textarea id="lesson-note" rows="4" oninput="saveLessonNote(' + n + ')" class="w-full px-3 py-2 rounded-lg border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm" placeholder="What worked, what ran over, what to change…"></textarea>');
}
function saveLessonNote(n){ var all = jget(STORAGE.lnote, {}); all[n] = $('lesson-note').value; jset(STORAGE.lnote, all); }
function loadLessonNote(n){ var el = $('lesson-note'); if (el) el.value = (jget(STORAGE.lnote, {})[n] || ''); }

function paneRun(n){
    var l = lessonOf(n), m = LESSON_META[n] || { criteria:[] };
    var top = '<div class="glass-card bg-white dark:bg-slate-800 p-5 md:p-6 rounded-xl border border-slate-300 dark:border-slate-700 border-t-4 border-t-whs-gold">'
        + '<div class="grid md:grid-cols-2 gap-x-8 gap-y-2 text-sm text-slate-700 dark:text-slate-300 mb-4">'
        +   '<p><strong class="text-whs-dark dark:text-whs-light">Knowledge:</strong> ' + esc(l.k) + '</p>'
        +   '<p><strong class="text-whs-dark dark:text-whs-light">Practice:</strong> ' + esc(l.p) + '</p></div>'
        + '<div class="aim-box"><div class="aim-rest">'
        +   '<p class="int-line">' + esc(m.intent || '') + '</p>'
        +   '<div class="int-crit"><strong>By the end students should be able to say:</strong><ul>'
        +     (m.criteria || []).map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>'
        + '</div><div class="aim-do"><strong>Exit ticket</strong><span class="text-slate-700 dark:text-slate-300">' + (m.exit ? esc(m.exit) : 'No exit ticket this lesson.')
        +   (m.exit ? ' <em class="text-slate-500 dark:text-slate-400">(' + esc(m.exitWhere || 'in books, under today\u2019s notes') + ')</em>' : '') + '</span></div></div>'
        + '</div>';
    var field = (UNIT.fieldTool && UNIT.fieldTool.lessons.indexOf(n) > -1) ? fieldToolHTML() : '';
    return top + whereTilesHTML(n) + runTableHTML(n) + field
        + '<div class="grid lg:grid-cols-2 gap-6 t-two">' + prepHTML(n) + notesHTML(n) + '</div>'
        + '<div class="grid lg:grid-cols-2 gap-6 t-two">' + wordsHTML(n) + lessonNoteHTML(n) + '</div>';
}

/* ---------- pane 2: slides ---------- */
var SLIDE_KIND_LABEL = { title:'Title', aim:'Learning intention', where:'Where the work goes', ask:'Question', idea:'Teaching point',
    fact:'Key figure', two:'Two columns', icons:'Pictures', pic:'Diagram', video:'Video', quiz:'Quiz question', task:'Task list',
    copy:'Notes to copy', sheet:'Worksheet', cards:'Card set', answers:'Answers', review:'Review and exit ticket', field:'Class data', words:'Key words' };

function paneSlides(n){
    var deck = SLIDES[n] || [];
    var intro = card('<div class="flex flex-wrap items-center justify-between gap-3">'
        + '<div>' + h3('🎬 Lesson ' + n + ' slideshow — ' + deck.length + ' slides')
        + '<p class="text-sm text-slate-600 dark:text-slate-400">Click any slide to present from there. In the slideshow: arrows or space to move, <kbd>N</kbd> for your notes, <kbd>T</kbd> for the phase timer, <kbd>F</kbd> fullscreen, <kbd>Esc</kbd> to close. Quiz and answer slides reveal on the next press.</p></div>'
        + '<span class="flex flex-wrap gap-2 no-print"><button onclick="openDeck(' + n + ')" class="deck-launch primary">▶ Present</button>'
        + '<button onclick="downloadDeck(' + n + ')" class="deck-launch">⇩ Download as PowerPoint</button></span></div>');
    var grid = '<div class="t-thumbs">' + deck.map(function(s, i){
        var p = PHASE_BY[s.ph] || PHASES[0];
        return '<div class="t-thumb">'
            + '<button class="t-thumb-frame" onclick="openDeck(' + n + ',' + i + ')" aria-label="Present from slide ' + (i + 1) + '">'
            +   '<span class="t-thumb-inner">' + slideHTML(s, true) + '</span></button>'
            + '<div class="t-thumb-meta"><span class="t-thumb-n">' + (i + 1) + '</span>'
            +   '<span class="t-ph ' + p.cls + '">' + p.label + '</span>'
            +   '<span class="t-thumb-kind">' + (SLIDE_KIND_LABEL[s.k] || 'Slide') + '</span></div>'
            + (s.n ? '<p class="t-thumb-note">' + (i === 0 && s.k === 'title' ? 'The whole run sheet is in this slide\u2019s notes, so it travels with the PowerPoint.' : esc(s.n)) + '</p>' : '')
            + '</div>';
    }).join('') + '</div>';
    return intro + grid;
}

/* ---------- pane 3: hand-outs ---------- */
function frameHTML(doc, id){
    return '<iframe class="t-paper" id="' + id + '" title="Preview" srcdoc="' + esc(doc) + '" onload="fitFrame(this)"></iframe>';
}
function fitFrame(f){
    try { var d = f.contentDocument; if (d && d.body) f.style.height = Math.min(3200, Math.max(300, d.body.offsetHeight + 40)) + 'px'; } catch (e) {}
}
function fitFrames(){ document.querySelectorAll('iframe.t-paper').forEach(function(f){ fitFrame(f); }); }

function paneHand(n){
    var out = '';
    if (hasWorksheet(n)) {
        var w = WORKSHEETS[n];
        out += card('<div class="flex flex-wrap items-center justify-between gap-3 mb-3"><div>'
            + h3('📄 Worksheet — ' + esc(strip(w.title)))
            + '<p class="text-sm text-slate-600 dark:text-slate-400">' + esc(w.print || 'One per student.') + (w.collect ? ' <strong>Collect it at the end</strong> — ' + esc(w.collect) : ' ' + esc(wsAfter(w, 'where'))) + '</p></div>'
            + '<span class="flex flex-wrap gap-2 no-print">'
            +   '<button onclick="openWorksheet(' + n + ')" class="deck-launch primary">🖨️ Print the worksheet</button>'
            +   '<button onclick="openWorksheet(' + n + ',\'key\')" class="deck-launch">🔑 Print with the answers</button></span></div>'
            + frameHTML(printableDoc(worksheetHTML(n), 'preview', '', true), 'ws-frame-' + n), 'border-2 t-sheet-card');

function fieldSlideIndex(){

function fieldChartSVG(big){
    var ft = UNIT.fieldTool, d = fieldData(), vals = ft.cats.map(function(c, i){ return Number(d[i]) || 0; });
    var max = Math.max.apply(null, vals.concat([1])), total = vals.reduce(function(a, b){ return a + b; }, 0);
    var W = 760, rowH = 40, left = 230, H = ft.cats.length * rowH + 50;
    var ink = big ? '#0f172a' : 'currentColor';
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;font-family:Arial,Helvetica,sans-serif" role="img" aria-label="Bar chart of the class fieldwork tallies">';
    ft.cats.forEach(function(c, i){
        var y = 10 + i * rowH, w = Math.round((W - left - 70) * vals[i] / max);
        s += '<text x="' + (left - 10) + '" y="' + (y + 22) + '" text-anchor="end" font-size="15" fill="' + ink + '">' + esc(c) + '</text>'
           + '<rect x="' + left + '" y="' + (y + 5) + '" width="' + Math.max(w, 1) + '" height="26" rx="3" fill="#1d5c9c"/>'
           + '<text x="' + (left + Math.max(w, 1) + 8) + '" y="' + (y + 24) + '" font-size="15" font-weight="bold" fill="' + ink + '">' + vals[i] + '</text>';

/* ---------- YouTube, click-to-play ---------- */
function ytWatchURL(id, start){ return 'https://www.youtube.com/watch?v=' + id + (start ? '&t=' + start + 's' : ''); }
function vidPosterHTML(id, start, cap){
    return '<div class="vid-wrap"><a class="vid-poster" href="' + ytWatchURL(id, start) + '" target="_blank" rel="noopener"'
        + ' onclick="return vidPlay(this,\'' + id + '\',' + (start || 0) + ')"'
        + ' style="background-image:url(https://i.ytimg.com/vi/' + id + '/hqdefault.jpg)" aria-label="Play video: ' + esc(cap || '') + '">'
        + '<span class="vid-play"></span>' + (cap ? '<span class="vid-cap">' + esc(cap) + '</span>' : '') + '</a></div>';
}
function vidPlay(el, id, start){
    /* YouTube refuses to embed in a page opened straight from disk (file://). Open it on YouTube instead. */
    if (location.protocol === 'file:') return true;
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0' + (start ? '&start=' + start : '');
    f.title = 'YouTube video';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.setAttribute('allowfullscreen', '');
    el.parentNode.replaceChild(f, el);
    return false;
}

/* ---------- presenter ---------- */
function slideModes(s){
    if (s.k === 'copy') return ['book'];
    if (s.k === 'sheet' || s.k === 'answers') return ['sheet'];

        sl.addText(strip(s.say || wss.intro), { x:0.55, y:1.65, w:8.9, h:1.3, fontSize:16, color:PPT.ink, fontFace:'Calibri', lineSpacingMultiple:1.3, valign:'top', fit:'shrink' });
        if (s.body) pptxBullets(sl, s.body, 0.55, 3.0, 8.9, 1.25, 14, PPT.ink);
        sl.addText(wsAfter(wss, 'slide'), { x:0.55, y:4.4, w:8.9, h:0.4, fontSize:12, color:PPT.mute, fontFace:'Calibri', italic:true });
    } else if (k === 'cards') {
        var cs = CARDS[n] || { title:'', how:[] };
        pptxBand(pptx, sl, 'cards', cs.per || '');
        pptxHead(sl, cs.title, 0.6, 26);
        sl.addText((cs.how || []).map(function(t, i){ return { text:(i+1) + '.  ' + strip(t), options:{ breakLine:true } }; }),
            { x:0.55, y:1.5, w:8.9, h:3.3, fontSize:17, color:PPT.ink, fontFace:'Calibri', lineSpacingMultiple:1.35, valign:'top', fit:'shrink' });
    } else if (k === 'answers') {
        pptxBand(pptx, sl, 'sheet', s.sub || 'Mark your own, in a different colour');
        pptxHead(sl, s.h || 'Check your answers', 0.5, 24);
        var runs2 = [];
        (s.qs || []).forEach(function(q){
            runs2.push({ text:'Q' + q + '   ', options:{ bold:true, color:PPT.goldink } });
            runs2.push({ text:shown ? strip(shortAnswer(n, q)) : '…', options:{ breakLine:true } });
        });
        sl.addText(runs2, { x:0.55, y:1.3, w:8.9, h:3.6, fontSize:15, color:PPT.ink, fontFace:'Calibri', lineSpacingMultiple:1.3, valign:'top', fit:'shrink' });
    } else if (k === 'words') {
        pptxKick(sl, s.kick || 'Key words', 0.45);
        var wy = 0.85;
        if (s.h) { pptxHead(sl, s.h, 0.8, 24); wy = 1.6; }
        var runs3 = [];
        (s.terms || []).forEach(function(t){
            var g = GLOSSARY[t] || { def:'' };
            runs3.push({ text:t, options:{ bold:true, color:PPT.navy, breakLine:true } });
            runs3.push({ text:g.def + (s.eg && g.eg ? '  —  ' + g.eg : ''), options:{ breakLine:true } });
            runs3.push({ text:' ', options:{ fontSize:6, breakLine:true } });
        });
        sl.addText(runs3, { x:0.55, y:wy, w:8.9, h:4.9 - wy, fontSize:16, color:PPT.ink, fontFace:'Calibri', lineSpacingMultiple:1.2, valign:'top', fit:'shrink' });
    } else if (k === 'field') {
        pptxKick(sl, s.kick || 'Our data', 0.45);
        pptxHead(sl, s.h, 0.8, 24);
        var ft = UNIT.fieldTool, d = fieldData();
        sl.addTable([[{ text:'What we found', options:{ bold:true, fill:{ color:'ECEEF2' } } }, { text:'Class total', options:{ bold:true, fill:{ color:'ECEEF2' } } }]]
            .concat(ft.cats.map(function(c, i){ return [c, d[i] === undefined ? '' : String(d[i])]; })),
            { x:0.55, y:1.55, w:6.2, colW:[4.4, 1.8], fontSize:12, fontFace:'Calibri', color:PPT.ink, border:{ type:'solid', color:'94A3B8', pt:1 } });
        if (s.body) pptxBullets(sl, s.body, 7.0, 1.55, 2.45, 3.2, 12.5, PPT.ink);
    } else {
        if (s.kick) pptxKick(sl, s.kick, 0.2);
        sl.addShape(pptx.ShapeType.rect, { x:0.55, y:0.5, w:1.1, h:0.05, fill:{ color:PPT.gold } });
        pptxHead(sl, s.h, 0.65, 28);
        if (s.body && (!s.reveal || shown)) pptxBullets(sl, s.body, 0.55, 1.62, 8.9, s.foot ? 2.95 : 3.3, 15.5, PPT.ink, { lineSpacingMultiple:1.25 });
        if (s.foot) sl.addText(strip(s.foot), { x:0.55, y:4.62, w:8.9, h:0.4, fontSize:11, italic:true, color:PPT.mute, fontFace:'Calibri', fit:'shrink' });
    }
    return sl;
}

function buildDeck(pptx, n, pics){
    pptx.layout = 'LAYOUT_16x9';
    (SLIDES[n] || []).forEach(function(s){
        for (var st = 0; st < slideSteps(s); st++) pptxAddSlide(pptx, n, s, pics, st);
    });
}
function deckPics(n){
    var ids = [];
    (SLIDES[n] || []).forEach(function(s){ if (s.k === 'pic' && FIGS[s.fig] && ids.indexOf(s.fig) < 0) ids.push(s.fig); });
    return Promise.all(ids.map(function(id){ return svgToPng(FIGS[id], 1600); })).then(function(arr){
        var out = {}; ids.forEach(function(id, i){ if (arr[i]) out[id] = arr[i]; }); return out;
    });
}
function downloadDeck(n){
    showNotification('Building the Lesson ' + n + ' PowerPoint…', 'bg-slate-700');
    loadPptx(function(){
        deckPics(n).then(function(pics){
            var pptx = new PptxGenJS();
            pptx.author = SITE.school;
            pptx.title = 'Lesson ' + n + ' — ' + lessonTitle(n);
            buildDeck(pptx, n, pics);
            pptx.writeFile({ fileName:siteFile('Lesson-' + pad2(n) + '.pptx') });
            showNotification('✓ Lesson ' + n + ' PowerPoint downloading', 'bg-green-600');
        });
    });
}

   PRINTABLES — worksheets, card sets, answer keys, lesson plans, unit plan
   Everything opens in a new tab ready to print, download for Word, or copy
   into a Google Doc.

/* ---------- answers: read off the block itself ---------- */
function blockAnswer(b){
    var out = '';
    if (b.t === 'match' && b.key) {
        out = b.key.map(function(k, i){ return (i + 1) + '\u2009' + LETTER(k); }).join(' \u00b7 ');
    } else if (b.t === 'mcq' && b.a !== undefined && b.opts) {
        out = '<strong>' + LETTER(b.a) + '</strong> \u2014 ' + b.opts[b.a];
    } else if (b.t === 'pick' && b.key) {
        var codes = (b.codes || []).map(function(c){ return c[0]; });
        out = codes.map(function(c, ci){
            var hits = []; b.key.forEach(function(k, i){ if (k === c) hits.push(i + 1); });
            return '<strong>' + esc(b.codes[ci][1]) + ' (' + esc(c) + '):</strong> ' + (hits.length ? hits.join(', ') : 'none');
        }).join(' \u00b7 ');
    } else if (b.t === 'passage' && b.key) {
        var groups = {}, order = [];
        b.key.forEach(function(k, i){ if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(i + 1); });
        var names = b.keyNames || { F:'Facts', O:'Opinions' };
        out = order.map(function(k){ return '<strong>' + esc(names[k] || k) + ':</strong> sentences ' + groups[k].join(', '); }).join(' \u00b7 ');
    }
    if (b.ans) out += (out ? '<br>' : '') + b.ans;
    return out;
}
function blockLabel(b){
    return (b.q ? b.q + '. ' : '') + (b.label || '') + (b.marks ? ' <span class="wmk">[' + b.marks + (b.marks === 1 ? ' mark' : ' marks') + ']</span>' : '');
}

/* ---------- worksheet HTML ---------- */
function wsBlockHTML(b){
    var h = '', lab = blockLabel(b);
    function lines(n, cls){ var out = ''; for (var i = 0; i < n; i++) out += '<div class="wl ' + (cls || '') + '"></div>'; return out; }
    switch (b.t) {
    case 'text': return '<p class="wt">' + b.body + '</p>';
    case 'html': return '<div class="wb wfree">' + b.body + '</div>';
    case 'head': return '<div class="wsec">' + b.body + (b.marks ? ' <span class="wmk">[' + b.marks + ' marks]</span>' : '') + '</div>';
    case 'lines':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>';
        if (b.hint) h += '<div class="whint">' + b.hint + '</div>';
        if (b.fields) h += b.fields.map(function(f){ return '<div class="wfield">' + f + '</div>'; }).join('');
        return h + lines(b.n || 0) + '</div>';
    case 'q':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>';
        if (b.hint) h += '<div class="whint">' + b.hint + '</div>';
        if (b.fields) h += b.fields.map(function(f){ return '<div class="wsub">' + f + '</div>' + lines(b.flines || 2); }).join('');
        else for (var i = 1; i <= (b.n || 0); i++) h += '<div class="wnum">' + i + '.</div>' + lines(b.lines || 2);
        return h + '</div>';
    case 'table': {
        var w = b.w || [], total = w.reduce(function(a, c){ return a + c; }, 0) || b.head.length;
        h = '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '') + '<table class="wtab"><thead><tr>'
          + b.head.map(function(c, i){
              var pc = w.length ? (w[i] / total * 100).toFixed(1) + '%' : (100 / b.head.length) + '%';
              return '<th style="width:' + pc + '">' + c + '</th>';
            }).join('') + '</tr></thead><tbody>';
        var cell = b.h ? '<td style="height:' + b.h + '"></td>' : '<td></td>';
        if (b.body) h += b.body.map(function(r){
            return '<tr>' + r.map(function(c, i){
                if (c === '' || c === null) return cell;
                return i === 0 && b.rowHead !== false ? '<th class="wrow" style="width:auto">' + c + '</th>' : '<td class="wfill"' + (b.h ? ' style="height:' + b.h + '"' : '') + '>' + c + '</td>';
            }).join('') + '</tr>';
        }).join('');
        if (b.fixed) h += b.fixed.map(function(f){ return '<tr><th class="wrow">' + f + '</th>' + new Array(b.head.length).join(cell) + '</tr>'; }).join('');
        for (var r = 0; r < (b.rows || 0); r++) h += '<tr>' + new Array(b.head.length + 1).join(cell) + '</tr>';
        return h + '</tbody></table></div>';
    }
    case 'grid':
        return '<div class="wb"><div class="wlab">' + lab + '</div><table class="wtab"><thead><tr><th style="width:26%"></th>'
          + b.cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>'
          + b.rows.map(function(r){ return '<tr><th class="wrow">' + r + '</th>' + new Array(b.cols.length + 1).join('<td></td>') + '</tr>'; }).join('')
          + '</tbody></table></div>';
    case 'tchart':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '') + '<table class="wtab wtchart"><thead><tr>'
          + '<th style="width:50%">' + b.left + '</th><th style="width:50%">' + b.right + '</th></tr></thead><tbody>';
        for (var t = 0; t < b.rows; t++) h += '<tr><td' + (b.h ? ' style="height:' + b.h + '"' : '') + '></td><td></td></tr>';
        return h + '</tbody></table></div>';
    case 'steps':
        h = '<div class="wb"><div class="wlab">' + lab + '</div>';
        for (var s2 = 1; s2 <= b.n; s2++) {
            h += '<div class="wstep"><span class="wstepn">' + (b.names ? b.names[s2 - 1] : s2) + '</span><span class="wstepbox"' + (b.h ? ' style="height:' + b.h + '"' : '') + '></span></div>';
            if (s2 < b.n) h += '<div class="warrow">\u2193</div>';
        }
        return h + '</div>';
    case 'scale':
        return '<div class="wb"><div class="wlab">' + lab + '</div>'
            + '<div class="wscale"><span>' + b.left + '</span><span>' + b.right + '</span></div><div class="wscaleline"></div>'
            + '<div class="whint" style="margin-top:.5rem">' + (b.hint || 'Mark your X on the line, then explain in one sentence.') + '</div><div class="wl"></div></div>';
    case 'match':
        return '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '')
            + '<table class="wtab wmatch"><thead><tr><th style="width:27%">' + (b.heads ? b.heads[0] : 'Term') + '</th><th style="width:9%">Letter</th><th>' + (b.heads ? b.heads[1] : 'Meanings') + '</th></tr></thead><tbody>'
            + b.left.map(function(l, i){
                return '<tr><th class="wrow" style="width:auto">' + (i + 1) + '. ' + l + '</th><td></td><td class="wfill">' + (b.right[i] !== undefined ? '<strong>' + LETTER(i) + '</strong> &nbsp;' + b.right[i] : '') + '</td></tr>';
              }).join('')
            + b.right.slice(b.left.length).map(function(r, j){ return '<tr><th class="wrow" style="width:auto"></th><td></td><td class="wfill"><strong>' + LETTER(b.left.length + j) + '</strong> &nbsp;' + r + '</td></tr>'; }).join('')
            + '</tbody></table></div>';
    case 'mcq':
        return '<div class="wb"><div class="wlab">' + lab + '</div><div class="wmcq' + (b.inline ? ' inline' : '') + '">'
            + b.opts.map(function(o, i){ return '<span><span class="wcirc">' + LETTER(i) + '</span> ' + o + '</span>'; }).join('') + '</div></div>';
    case 'pick':
        return '<div class="wb"><div class="wlab">' + lab + '</div>'
            + '<div class="whint">' + (b.hint ? b.hint + ' ' : '') + 'Write ' + (b.codes || []).map(function(c){ return '<strong>' + c[0] + '</strong> for ' + c[1]; }).join(', ').replace(/, ([^,]*)$/, ' or $1') + ' in each box.</div>'
            + '<div class="wpick c' + (b.cols || 2) + '">' + b.items.map(function(x, i){ return '<div><span class="wbox"></span><span><span class="wpn">' + (i + 1) + '</span> ' + x + '</span></div>'; }).join('') + '</div></div>';
    case 'passage':
        return '<div class="wb wpass">' + (b.label ? '<div class="wlab">' + lab + '</div>' : '')
            + '<div class="wart">' + (b.kick ? '<div class="wartk">' + b.kick + '</div>' : '') + '<div class="warth">' + b.title + '</div>' + (b.by ? '<div class="wartb">' + b.by + '</div>' : '')
            + '<p>' + b.sents.map(function(s, i){ return (b.paras && b.paras.indexOf(i) > -1 ? '</p><p>' : '') + '<sup>' + (i + 1) + '</sup>' + s; }).join(' ') + '</p></div></div>';
    case 'fig':
        return '<div class="wb wfig"' + (b.w ? ' style="max-width:' + b.w + ';margin-left:auto;margin-right:auto"' : '') + '>' + (b.label ? '<div class="wlab">' + lab + '</div>' : '')
            + (FIGS[b.fig] || '') + (b.cap ? '<div class="wcap">' + b.cap + '</div>' : '') + '</div>';
    case 'box':
        return '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '')
            + '<div class="wdraw" style="height:' + (b.h || '60mm') + '">' + (b.inner || '') + '</div></div>';
    case 'check':
        return '<div class="wb"><div class="wlab">' + lab + '</div>' + (b.hint ? '<div class="whint">' + b.hint + '</div>' : '')
            + '<div class="wcheck c' + (b.cols || 1) + '">' + b.items.map(function(x){ return '<div><span class="wbox"></span><span>' + x + '</span></div>'; }).join('') + '</div></div>';
    case 'rubric': return '<div class="wb">' + (b.label ? '<div class="wlab">' + lab + '</div>' : '') + rubricTableHTML(b.student !== false) + '</div>';
    case 'break': return '<div style="page-break-before:always"></div>';
    }
    return '';
}

function rubricTableHTML(student){
    var R = (UNIT.assess || {}).rubric; if (!R) return '';
    return '<table class="wtab wrub"><thead><tr><th style="width:19%">' + (student ? 'What we look for' : 'Criterion') + '</th>'
        + R.bands.map(function(b){ return '<th>' + esc(b) + '</th>'; }).join('') + '</tr></thead><tbody>'
        + R.rows.map(function(r){
            return '<tr><th class="wrow" style="width:auto">' + r.name + '</th>' + r.levels.map(function(x){ return '<td class="wfill">' + x + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
}

/* ---------- open / download machinery ---------- */
function printableDoc(bodyHTML, docTitle, fileBase, preview){
    return '<!DOCTYPE html><html lang="en-NZ"><head><meta charset="utf-8">'
        + '<title>' + esc(docTitle) + '</title><style>' + WS_CSS + '</style></head><body' + (preview ? ' class="preview"' : '') + '>'
        + (preview ? ''
            : '<div class="noprint"><button onclick="window.print()">Print / save as PDF</button>'
              + '<button class="alt" onclick="dl()">Download for Word</button>'
              + '<button class="alt" onclick="gdoc(this)">Copy for Google Docs</button></div>')
        + bodyHTML
        + (preview ? '' :
          '<script>'
        /* diagrams are SVG; Word and Google Docs want pictures, so swap them first */
        + 'function rast(cb){var s=[].slice.call(document.querySelectorAll("svg"));var left=s.length;if(!left){cb();return;}'
        +   's.forEach(function(sv){var r=sv.getBoundingClientRect();var w=Math.max(60,Math.round(r.width)),h=Math.max(30,Math.round(r.height));'
        +   'var x=new XMLSerializer().serializeToString(sv);'
        +   'x=x.replace(/^<svg([^>]*)>/,function(m,a){a=a.replace(/\\sstyle="[^"]*"/,"").replace(/\\s(width|height)="[^"]*"/g,"");return "<svg"+a+" width=\\""+(w*2)+"\\" height=\\""+(h*2)+"\\">";});'
        +   'var im=new Image();im.onload=function(){try{var c=document.createElement("canvas");c.width=w*2;c.height=h*2;var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);'
        +     'var o=document.createElement("img");o.src=c.toDataURL("image/png");o.width=w;o.height=h;o.style.maxWidth="100%";sv.parentNode.replaceChild(o,sv);}catch(e){}if(--left===0)cb();};'
        +   'im.onerror=function(){if(--left===0)cb();};im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x);});}'
        + 'function dl(){rast(function(){var h=document.documentElement.outerHTML;'
        +   'var b=new Blob(["\\ufeff"+h],{type:"application/msword"});'
        +   'var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=' + JSON.stringify((fileBase || 'document') + '.doc') + ';a.click();});}'
        + 'function gdoc(btn){rast(function(){'
        +   'var node=document.querySelectorAll(".wsheet");var wrap=document.createElement("div");'
        +   'for(var i=0;i<node.length;i++){wrap.appendChild(node[i].cloneNode(true));}'
        +   'var html="<html><head><meta charset=\\"utf-8\\"><style>"+document.querySelector("style").textContent+"<\\/style><\\/head><body>"+wrap.innerHTML+"<\\/body><\\/html>";'
        +   'function done(){btn.textContent="\\u2713 Copied \\u2014 now paste into Google Docs";'
        +     'setTimeout(function(){window.open("https://docs.new","_blank");},400);'
        +     'setTimeout(function(){btn.textContent="Copy for Google Docs";},6000);}'
        +   'function fallback(){var d=document.createElement("div");d.id="gdoc-stage";'
        +     'd.setAttribute("contenteditable","true");d.innerHTML=wrap.innerHTML;document.body.appendChild(d);'
        +     'var r=document.createRange();r.selectNodeContents(d);var sel=window.getSelection();'
        +     'sel.removeAllRanges();sel.addRange(r);'
        +     'try{document.execCommand("copy");done();}catch(e){btn.textContent="Copy failed \\u2014 select and copy by hand";}'
        +     'sel.removeAllRanges();d.remove();}'
        +   'if(navigator.clipboard&&window.ClipboardItem){'
        +     'try{navigator.clipboard.write([new ClipboardItem({'
        +       '"text/html":new Blob([html],{type:"text/html"}),'
        +       '"text/plain":new Blob([wrap.textContent],{type:"text/plain"})})])'
        +       '.then(done).catch(fallback);}catch(e){fallback();}'
        +   '}else{fallback();}'
        + '});}<\/script>')
        + '</body></html>';
}
function openPrintable(bodyHTML, docTitle, fileBase){
    var win = window.open('', '_blank');
    if (!win) { showNotification('Your browser blocked the pop-up \u2014 allow pop-ups for this page', 'bg-red-600'); return; }
    win.document.open(); win.document.write(printableDoc(bodyHTML, docTitle, fileBase, false)); win.document.close();
}
var PB = '<div style="page-break-before:always"></div>';
function tagx(text, hex){ return '<span class="wtagx" style="background:#' + hex + '">' + text + '</span>'; }

/* ---------- worksheets ---------- */
function worksheetHTML(n, mode){
    var w = WORKSHEETS[n]; if (!w) return '';
    var key = mode === 'key';
    var kind = w.kind || 'Worksheet';
    return '<div class="wsheet">'
        + '<div class="whead">'
        +   '<div class="wkicker">' + tagx('\uD83D\uDCC4 ' + esc(kind) + (key ? ' \u2014 ANSWERS' : ''), key ? 'b91c1c' : 'c2410c')
        +     esc(siteKicker() + ' \u00b7 ' + SITE.unitBanner)
        +     (key ? '' : '<span style="float:right;color:#15803d">' + wsAfter(w, 'head') + '</span>') + '</div>'
        +   '<h1>' + (w.plainTitle ? '' : 'Lesson ' + n + ' \u2014 ') + w.title + '</h1>'
        +   (key ? '' : '<div class="wname"><span>' + (w.nameLabel || 'Name:') + '</span><span class="wnl"></span>' + (w.nameExtra ? '<span>' + w.nameExtra + '</span><span class="wnl short"></span>' : '') + '<span>Date:</span><span class="wnl short"></span></div>')
        + '</div>'
        + ((LESSON_META[n] && LESSON_META[n].intent && !w.noIntent) ? '<p class="wintent"><strong>What we are learning:</strong> ' + esc(LESSON_META[n].intent) + '</p>' : '')
        + (w.intro ? '<p class="wintro">' + w.intro + '</p>' : '')
        + w.blocks.map(function(b){
            var h = wsBlockHTML(b);
            if (key) { var a = blockAnswer(b); if (a) h += '<div class="wans"><strong>' + (b.q ? 'Q' + b.q + ' \u2014 ' : '') + (b.marks ? 'marking: ' : 'answer: ') + '</strong>' + a + '</div>'; }
            return h;
          }).join('')
        + '</div>';
}
function openWorksheet(n, mode){
    if (!WORKSHEETS[n]) { showNotification('No worksheet for lesson ' + n, 'bg-slate-700'); return; }
    var key = mode === 'key';
    openPrintable(worksheetHTML(n, mode), 'Lesson ' + n + (key ? ' worksheet with answers \u2014 ' : ' worksheet \u2014 ') + strip(WORKSHEETS[n].title),
        siteFile('Lesson-' + pad2(n) + (key ? '-worksheet-ANSWERS' : '-worksheet')));
}
function wsKeys(){ return Object.keys(WORKSHEETS).map(Number).sort(function(a, b){ return a - b; }); }
function cardKeys(){ return Object.keys(CARDS).map(Number).sort(function(a, b){ return a - b; }); }
function openAllWorksheets(mode){
    var body = wsKeys().map(function(n, i){ return (i ? PB : '') + worksheetHTML(n, mode); }).join('');
    openPrintable(body, (mode === 'key' ? 'All worksheets with answers \u2014 ' : 'All worksheets \u2014 ') + SITE.unitBanner, siteFile(mode === 'key' ? 'all-worksheets-ANSWERS' : 'all-worksheets'));
}

/* ---------- card sets ---------- */
function cardsHTML(n){
    var c = CARDS[n]; if (!c) return '';
    var h = '<div class="wsheet"><div class="whead"><div class="wkicker">' + tagx('\u2702\uFE0F Card set', '0f766e') + esc(siteKicker() + ' \u00b7 ' + SITE.unitBanner)
        + '<span style="float:right;color:#0f766e">' + esc(c.per || 'One set per group') + '</span></div>'
        + '<h1>Lesson ' + n + ' \u2014 ' + esc(c.title) + '</h1></div>'
        + '<p class="wintro"><strong>Teacher:</strong> ' + (c.intro || 'Print single-sided and cut along the dashed lines.') + '</p>';
    (c.groups || []).forEach(function(g){
        var cols = g.cols || c.cols || 3, items = g.items.slice();
        if (g.label) h += '<div class="cglabel">' + g.label + '</div>';
        h += '<table class="ctab"><tbody>';
        for (var i = 0; i < items.length; i += cols) {
            h += '<tr>';
            for (var j = 0; j < cols; j++) {
                var x = items[i + j];
                if (!x) { h += '<td class="cempty"></td>'; continue; }
                if (x.h) h += '<td class="crole">' + (x.sub ? '<span class="cs">' + x.sub + '</span>' : '') + '<span class="ch">' + x.h + '</span>' + x.t + '</td>';
                else h += '<td' + (x.head ? ' class="chead"' : '') + (g.h ? ' style="height:' + g.h + '"' : '') + '>' + x.t + '</td>';
            }
            h += '</tr>';
        }
        h += '</tbody></table>';
        if (g.breakAfter) h += PB;
    });
    return h + '</div>';
}
function openCards(n){
    if (!CARDS[n]) { showNotification('No card set for lesson ' + n, 'bg-slate-700'); return; }
    openPrintable(cardsHTML(n), 'Lesson ' + n + ' card set \u2014 ' + CARDS[n].title, siteFile('Lesson-' + pad2(n) + '-cards'));
}
function openAllCards(){
    openPrintable(cardKeys().map(function(n, i){ return (i ? PB : '') + cardsHTML(n); }).join(''), 'All card sets \u2014 ' + SITE.unitBanner, siteFile('all-card-sets'));
}
function cardsAnswer(n){
    var c = CARDS[n]; if (!c) return '';
    if (c.ans) return c.ans;
    if (!c.cats) return '';
    var out = [];
    Object.keys(c.cats).forEach(function(k){
        var hits = [];
        (c.groups || []).forEach(function(g){ g.items.forEach(function(x){ if (x.c === k) hits.push(strip(x.t)); }); });
        if (hits.length) out.push('<strong>' + esc(c.cats[k]) + ':</strong> ' + hits.map(esc).join('; ') + '.');
    });
    return out.join('<br>') + (c.ansNote ? '<br><em>' + c.ansNote + '</em>' : '');
}

/* ---------- answer keys ---------- */
function answerRows(n){
    var rows = [], w = WORKSHEETS[n], m = LESSON_META[n] || {};
    (SLIDES[n] || []).forEach(function(s){
        if (s.k === 'quiz') { var qp = quizPos(s); rows.push({ sec:'Slide quiz', q:'Quiz ' + qp.i, a:'<em>' + esc(strip(s.h)) + '</em> \u2014 <strong>' + LETTER(s.a) + '</strong> ' + s.opts[s.a] + (s.why ? '. ' + s.why : '') }); }
        if (s.k === 'two' && s.reveal && !hasCards(n) && !s.nokey) rows.push({ sec:'On the slides', q:'Sort', a:'<em>' + esc(strip(s.h)) + '</em> \u2014 <strong>' + strip(s.a.h) + ':</strong> ' + s.a.body.map(strip).join('; ') + '. <strong>' + strip(s.b.h) + ':</strong> ' + s.b.body.map(strip).join('; ') + '.' + (s.foot ? ' <em>' + s.foot + '</em>' : '') });
    });
    if (hasCards(n) && cardsAnswer(n)) rows.push({ sec:'Card set \u2014 ' + CARDS[n].title, q:'Cards', a:cardsAnswer(n) });
    if (w) w.blocks.forEach(function(b){
        var a = blockAnswer(b);
        if (b.q && a) rows.push({ sec:(w.kind || 'Worksheet') + ' \u2014 ' + strip(w.title), q:'Q' + b.q + (b.marks ? ' [' + b.marks + ']' : ''), a:a });
        else if (!b.q && a) rows.push({ sec:(w.kind || 'Worksheet') + ' \u2014 ' + strip(w.title), q:b.keyLabel || 'Text', a:a });
    });
    if (w && w.markNote) rows.push({ sec:(w.kind || 'Worksheet') + ' \u2014 ' + strip(w.title), q:'Marking', a:w.markNote });
    if (BOOKWORK[n] && BOOKWORK[n].ans) rows.push({ sec:'Book work', q:'Book', a:BOOKWORK[n].ans });
    if (m.exit) rows.push({ sec:'Exit ticket', q:'Exit', a:'<em>' + esc(m.exit) + '</em>' + (m.exitAns ? ' \u2014 ' + m.exitAns : '') });
    return rows;
}
function answerKeyInner(n){
    var rows = answerRows(n), sec = null, h = '';
    if (!rows.length) return '<p>Nothing to mark this lesson.</p>';
    rows.forEach(function(r){
        if (r.sec !== sec) { h += '<div class="ak-h">' + esc(r.sec) + '</div>'; sec = r.sec; }
        h += '<div class="ak-row"><div class="ak-q">' + esc(r.q) + '</div><div class="ak-a">' + r.a + '</div></div>';
    });
    return h;
}
function answerKeyHTML(n){
    return '<div class="wsheet"><div class="whead"><div class="wkicker">' + tagx('\uD83D\uDD11 Answer key \u2014 teacher copy', 'b91c1c') + esc(siteKicker() + ' \u00b7 ' + SITE.unitBanner) + '</div>'
        + '<h1>Lesson ' + n + ' \u2014 ' + esc(lessonTitle(n)) + '</h1></div>' + answerKeyInner(n) + '</div>';
}
function openAnswerKey(n){ openPrintable(answerKeyHTML(n), 'Lesson ' + n + ' answer key \u2014 ' + lessonTitle(n), siteFile('Lesson-' + pad2(n) + '-answers')); }
function openAllAnswerKeys(){
    openPrintable(LESSONS.map(function(l, i){ return (i ? PB : '') + answerKeyHTML(l.n); }).join(''), 'All answer keys \u2014 ' + SITE.unitBanner, siteFile('all-answer-keys'));
}

/* ---------- one-page lesson plan ---------- */
function lessonPlanHTML(n){
    var l = lessonOf(n), m = LESSON_META[n] || { criteria:[] }, tm = TIMING[n] || {}, w = BOOKWORK[n], t = TNOTES[n] || {};
    var res = RESOURCES[n] || [], at = 0;
    function chip(mode){ return '<span class="pchip" style="background:#' + WORK_MODE[mode].hex + '">' + WORK_MODE[mode].short + '</span>'; }
    var h = '<div class="wsheet"><div class="whead"><div class="wkicker">' + tagx('\uD83D\uDCCB Lesson plan', '002066') + esc(siteKicker() + ' \u00b7 ' + SITE.unitBanner)
        + '<span style="float:right">' + (SITE.lessonMinutes || 60) + ' minutes</span></div>'
        + '<h1>Lesson ' + n + ' \u2014 ' + esc(l.t) + '</h1></div>'
        + '<p class="wt" style="font-size:9.6pt"><strong>Knowledge:</strong> ' + esc(l.k) + '<br><strong>Practice:</strong> ' + esc(l.p) + '</p>'
        + '<table class="wtab ptab" style="margin-bottom:.5rem"><tbody>'
        + '<tr><th class="wrow" style="width:16%">Intention</th><td>' + esc(m.intent || '') + '</td></tr>'
        + '<tr><th class="wrow">Success criteria</th><td>' + (m.criteria || []).map(function(c){ return '\u201c' + esc(c) + '\u201d'; }).join('<br>') + '</td></tr>'
        + '<tr><th class="wrow">Exit ticket</th><td>' + (m.exit ? esc(m.exit) + ' (' + esc(m.exitWhere || 'in books, under today\u2019s notes') + ')' : 'No exit ticket this lesson.') + '</td></tr>'
        + '</tbody></table>'
        + '<table class="wtab ptab"><thead><tr><th style="width:16%">Phase</th><th style="width:9%">Min</th><th>What happens</th><th style="width:11%">Slides</th></tr></thead><tbody>'
        + PHASES.map(function(p){
            var mn = tm[p.k] || 0, from = at; at += mn;
            return '<tr><th class="wrow" style="width:auto">' + p.label + '</th><td style="text-align:center">' + (mn ? mn + '<br><span style="color:#777;font-size:8pt">' + from + '\u2013' + at + '</span>' : '\u2014') + '</td><td>' + esc(l[p.field]) + '</td><td style="text-align:center">' + rangeText(phaseSlides(n, p.k)) + '</td></tr>';
          }).join('')
        + '</tbody></table>';
    var tl = taskLines(n);
    if (tl.length) h += '<div class="wlab" style="margin-top:.6rem;font-size:9.6pt">Where the work goes (the task slide)</div><ol class="pl">'
        + tl.map(function(p){ return '<li>' + (p.m ? chip(p.m) : '') + esc(p.t) + '</li>'; }).join('') + '</ol>';
    if ((PREP[n] || []).length) h += '<div class="wlab" style="margin-top:.6rem;font-size:9.6pt">Before the lesson</div><ul class="pl" style="list-style:none;margin-left:0">'
        + PREP[n].map(function(x){ return '<li>\u2610 ' + x + '</li>'; }).join('') + '</ul>';
    if (t.watch || t.support || t.extend || t.local) h += '<div class="wlab" style="margin-top:.6rem;font-size:9.6pt">Teaching notes</div><ul class="pl">'
        + (t.watch ? '<li><strong>Watch for:</strong> ' + t.watch + '</li>' : '') + (t.support ? '<li><strong>Support:</strong> ' + t.support + '</li>' : '')
        + (t.extend ? '<li><strong>Extend:</strong> ' + t.extend + '</li>' : '') + (t.local ? '<li><strong>Local:</strong> ' + t.local + '</li>' : '') + '</ul>';
    if (w && (w.copy || []).length) h += '<div class="wlab" style="margin-top:.6rem;font-size:9.6pt">Notes for students to copy \u2014 under the title \u201c' + esc(bookTitleFor(n)) + '\u201d</div><ol class="pl">'
        + w.copy.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ol>';
    if (res.length) h += '<div class="wlab" style="margin-top:.6rem;font-size:9.6pt">Links</div><ul class="pl" style="font-size:8.6pt;word-break:break-word">'
        + res.map(function(r){ return '<li><strong>' + esc(r.t) + '</strong> \u2014 ' + esc(r.o) + '<br><span style="color:#555">' + esc(r.u) + '</span></li>'; }).join('') + '</ul>';
    return h + '</div>';
}
function openLessonPlan(n){ openPrintable(lessonPlanHTML(n), 'Lesson ' + n + ' plan \u2014 ' + lessonTitle(n), siteFile('Lesson-' + pad2(n) + '-plan')); }
function lessonPackHTML(n){
    return lessonPlanHTML(n) + (hasWorksheet(n) ? PB + worksheetHTML(n) : '') + (hasCards(n) ? PB + cardsHTML(n) : '') + PB + answerKeyHTML(n);

function openLessonPack(n){ openPrintable(lessonPackHTML(n), 'Lesson ' + n + ' pack \u2014 ' + lessonTitle(n), siteFile('Lesson-' + pad2(n) + '-pack')); }

/* ---------- the printable unit plan ---------- */
function unitPlanHTML(){
    var h = '<div class="wsheet"><div class="whead"><div class="wkicker">' + esc(siteKicker()) + '</div>'
        + '<h1>' + esc(SITE.strand + ' \u2014 ' + SITE.unitTitle) + '</h1>'
        + '<div style="font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;color:#444">\u201c' + esc(SITE.unitBanner) + '\u201d \u00b7 ' + esc(SITE.unitBlurb) + ' \u00b7 compiled ' + esc(SITE.resChecked) + '</div></div>'
        + '<div class="wintro">' + (UNIT.planIntro || '') + '</div>'
        + '<table class="wtab ptab" style="margin-bottom:.8rem"><tbody><tr><th class="wrow" style="width:16%">Overview</th><td>' + esc(SITE.overview) + '</td></tr>'

  {
   "n": 1,
   "t": "What makes a community work?",
   "strand": "Democracy",
   "k": "Democracies depend on active participation. (Overview lesson — the key terms come back in depth in Lessons 2 and 3.)",
   "p": "Think conceptually: define democracy, participation and civic responsibility.",
   "c": "Brainstorm on the whiteboard in two columns: “What makes a community work?” and “Who makes the rules?” Think, pair, share, then take every answer and correct nothing yet. This is the prior-knowledge check, so photograph the board.",
   "i": "Define community, democracy, citizen, civic responsibility and participation in plain words from the two key-word slides, with a Waiheke example for each. Tell students this is an overview: every term comes back in Lessons 2 and 3.",
   "w": "Card sort in pairs: 12 actions under “Civic responsibility”, “Personal choice” or “Could be both”. Reveal the answers on the slide and let pairs argue the two “could be both” cards. Then run the two quiz questions.",
   "y": "Students copy the four notes into their books and write three civic responsibilities from the card sort under them. Then they draw their first concept map on the worksheet (Q1), starting from democracy, community and responsibility, with words on every line.",
   "r": "Exit ticket on the worksheet (Q2): one question about how our community is run. Collect every worksheet. The concept maps come back in Lesson 16 and the questions open Lesson 2.",
   "res": "Print the Lesson 1 worksheet, one per student, single-sided. Print the card set, one per pair, and cut it up — or hand out uncut sheets and scissors. Two colours of whiteboard marker for the two-column brainstorm. A folder labelled “L1 concept maps”. You hand these back in Lesson 16, so do not let them go home."

   "c": "Read out five of the Lesson 1 exit-ticket questions. With the class, sort each one on the board: is it about who decides, about money, or about how to get involved? Tell students these three headings are the next three weeks.",
   "i": "Teach closed and open questions from the key-word slide and the two-column examples. Model building an inquiry question about a littered beach: start with who, why or how, name the place and the problem, then test it with “can I answer this yes or no?”",
   "w": "Run the three quiz questions. Read the broken-playground scenario and write three class questions on the board, one who, one why and one how. Students turn three closed questions into open ones on the worksheet (Q1) and record the class’s three (Q2).",
   "y": "Students copy the three notes. On the worksheet they describe a challenge in their own neighbourhood (Q3) and write three open questions about how the community could fix it (Q4). Anyone stuck for a challenge takes a scenario card.",
   "r": "Pair-share and refine: partners swap sheets and tick the checklist (Q5), then help each other make one question better. Exit ticket in books.",
   "res": "Choose five exit-ticket questions from the Lesson 1 worksheets to read out. Print the Lesson 2 worksheet, one per student. Print one sheet of scenario cards and cut it up — six cards, for students who cannot think of a challenge."

  {
   "n": 3,
   "t": "Who is in charge here?",
   "strand": "Council",
   "k": "Local councils are elected and are responsible for specific services, including relationships with iwi.",
   "p": "Think conceptually: apply concepts of democracy to local government structures.",
   "c": "Show the map of Auckland’s 21 local board areas (in Links) or a wall map. Students find Waiheke. Ask: who is in charge here? Put the photo of the Lesson 1 “Who makes the rules?” brainstorm back up and see which answers still stand.",
   "i": "Teach central and local government, then use the diagram to explain the two parts of Auckland Council: the Governing Body and the 21 local boards. Play the Auckland Council video. Introduce the five-member Waiheke Local Board and its duty to build a relationship with mana whenua, including Ngāti Pāoa. Finish with the eight things a council is responsible for.",
   "w": "Students sort 12 services into local or central on the worksheet (Q1), then check against the slide. Run the three quiz questions.",
   "y": "Students copy the four notes, label the blank diagram (Q2) and plan five council responsibilities with a picture for each (Q3). Then, on a new page in their books, they draw an infographic: “5 things our council is responsible for”.",
   "r": "Gallery walk with books left open on desks, finished or not: find one responsibility you did not use. Exit ticket in books. Infographics can be finished at home.",
   "res": "Open the map of the 21 local board areas from Links before the bell, or pull down a wall map of Auckland. Have the photo of the Lesson 1 brainstorm ready to show. Print the Lesson 3 worksheet, one per student. Queue the video and watch it through once. Check the names of the five board members on the Waiheke Local Board page if you plan to use them. Coloured pencils for the infographic."

  {

   "t": "A day in the life of a council",
   "strand": "Council",
   "k": "Local councils are responsible for parks, water, libraries, rubbish and road planning.",
   "p": "Process information: collect and classify information about council services.",
   "c": "Picture flash: a water pipe, a park and a rubbish truck. Ask: what links these? Take guesses, then give the answer: somebody has to provide them for everyone, and in most places that is the council.",
   "i": "Teach service and infrastructure, then stormwater and wastewater. Use the two-column slide to show how Waiheke differs from the city: most island homes run on their own rain tanks and septic systems, but the council still looks after drains, roads, footpaths, parks, the library and rubbish. Finish with the word private.",
   "w": "Students classify 20 community features as provided by Auckland Council or private on the worksheet (Q1) and mark them from the answer slide. Talk through the three tricky ones — the school, the bus and the transfer station — and run the two quiz questions.",
   "y": "Students copy the four notes. Then they read “Mia’s Thursday” on the worksheet, highlight every council service she uses (Q2), list ten of them (Q3), choose the most important (Q4) and finish the story with two more (Q5).",
   "r": "Show the report-a-problem slide. Then students share their story endings and the class votes for the service it could least do without. Exit ticket in books.",
   "res": "Print the Lesson 4 worksheet, one per student, double-sided — the story is on the back. Highlighters or coloured pencils for marking up the story. Know your own class: how many are on tank water? It makes the Waiheke slide land."
