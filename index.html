   "c": "Write “Nothing is free” on the board. Ask: who pays for the local park — the mowing, the playground, the bins, the toilets? Take ideas without correcting them.",
   "i": "Define rates, ratepayer, user charge and government funding from the key-word slides. Show that about half the money for running Auckland comes from rates. Make the point that renters pay rates too, inside their rent. Finish with property value: it is how the council decides who pays what.",
   "w": "Read the made-up valuation notice and the classroom rates formula, and work through the $800,000 example on the board. Students then calculate three rates bills on the worksheet (Q1): the first together, the others in pairs. Q2 and Q3 compare the answer with the real Auckland average. Finish with the three quiz questions.",
   "y": "Students copy the four notes, then sort 12 services into paid by rates or paid by user charges (Q4) and write why they think the library is free to walk into while the transfer station charges (Q5).",
   "r": "Mark Q4 from the answer slide. Discuss Q5: why are some things free to use while others cost money? Exit ticket in books.",
   "res": "Print the Lesson 5 worksheet, one per student, double-sided: the rates sums are on the front and the sorting task is on the back. Calculators help with Q3, which divides by 52. Every other sum can be done by hand. Read the note on rates being close to home on the Start Here page. Never ask what a student’s family pays."

   "k": "There is debate about rates rises. Informed citizenship includes thinking critically about information.",

   "c": "Show the made-up front page. Ask: what is the writer trying to make you feel, and which words are doing it? Circle “shock”, “greedy grab”, “hits” and “furious” as students call them out.",
   "i": "Teach fact, opinion and statistic, then emotive language and bias, from the key-word slides. Give the checking test: could I check it? Then it is a fact. Is it what someone thinks or feels? Then it is an opinion. Practise on the four quiz statements.",
   "w": "Read Article A together, one sentence at a time. Students highlight facts in blue and opinions in red on the worksheet (Q1). Check against the answer slide and talk about the sentences people disagreed on.",
   "y": "Students copy the four notes. Then they read Article B on their own, sort its twelve sentences into a fact and opinion T-chart (Q2), list three emotive words or phrases (Q3) and decide whether the letter is biased, with a reason (Q4).",
   "r": "Check Q2 from the answer slide. Class vote: is Article B biased, and why? Exit ticket in books.",
   "res": "Print the Lesson 6 worksheet, one per student, double-sided. Blue and red highlighters or pencils, one of each per student. With no colours, underline facts and circle opinions. Read both articles yourself. They are made up for this lesson and use real 2026/27 figures."

   "c": "Quick debate on your feet: would you rather have a new skate park, or cheaper rates and rent for your family? Students pick a side of the room. Hear two reasons from each side, then let anyone who has changed their mind cross over.",
   "i": "Set out the two main arguments from the two-column slide: invest in the community, or reduce the financial burden. Teach argument, evidence and persuade, then campaign and rates cap. Explain that people campaign on both sides, and that in 2026 the Government announced a cap on rates rises.",
   "w": "Put the proposal on the board: a 10% rates rise. In groups of three or four, students sort the 12 argument cards into FOR and AGAINST. Build the class pro and con board from the reveal slide, and students write the two strongest arguments on each side on the worksheet (Q1). Two quiz questions.",
   "y": "Students copy the four notes. They plan a persuasive paragraph on the worksheet (Q2), taking one side and choosing at least two facts from the fact bank, then write it out in full in their books and underline their two facts.",

  {
   "n": 9,
   "t": "The community meeting",
   "strand": "Part",
   "k": "Informed citizenship includes noticing, listening and attending meetings.",
   "p": "Identify values and perspectives: find out about roles and perspectives in local organisations.",
   "c": "Show the drawing of a local board meeting, or a photo of a real one. Ask: why are these people there? Who is at the table, who is standing, and who is just listening?",
   "i": "Introduce the informal and formal ways citizens take part — noticing, talking, turning up to a meeting, a hui or a fono, speaking in the public forum, making a submission, voting. Teach public forum, chairperson, hui, fono and perspective. Give the real details for the Waiheke Local Board: three minutes each, at 10 Belgium Street, Ostend.",
   "w": "Watch three minutes of a real council meeting that you have chosen, or read the meeting script on the worksheet aloud with four volunteers. Students fill in the viewpoint grid (Q1), then find a fact that could be checked (Q2) and suggest a decision (Q3). Check Q1 to Q3 from the answer slide.",
   "y": "Students copy the four notes. In groups of four they role-play a community meeting from a set of role cards: one chairperson and three residents with different views. Each student records what their group decided on the worksheet (Q4).",
   "r": "Reflect together on the challenge of listening to opposing views: what made it hard, and what helped? Exit ticket in books.",
   "res": "Choose your meeting. Either pick about three minutes of public input from the Auckland Council Live channel (see Links) or plan to read the worksheet script aloud. The viewpoint grid works for both. Print the Lesson 9 worksheet, one per student. Print the role cards: three scenarios, one page each, four cards on a page. Each group of four needs one scenario, so for 28 students print two or three copies of each page and cut them up. Decide the groups of four in advance. If the mid-unit tests are marked, hand them back as students arrive and go over the question most of them found hardest."

   "c": "Ask: what is Polyfest, and why does it matter? Play the highlights video, then show the figures: four schools in 1976, nearly 300 groups by 2025. Who makes an event like that happen?",
   "i": "Explain that cultural events, community gardens and volunteering are civic responsibility too, and that they build social cohesion. Teach volunteer, community initiative and social cohesion. Use the two-column slide for examples of each kind, from Te Matatini to the volunteer fire brigade.",
   "w": "On the whiteboard, map the benefits of a shared food event: our street holds a shared kai and everyone brings a dish. Who benefits, and how? Build a mind map with the class under four branches. Two quiz questions.",

  {
   "n": 11,
   "t": "Fieldwork: clean-up and audit",
   "strand": "Part",
   "k": "Identify a local civic action and work collaboratively to carry it out.",
   "p": "Design, implement and evaluate social action: work collaboratively to carry out an initiative.",
   "c": "Brief in the classroom from the slides before you leave, or meet outside at the site and brief from the printed one-page plan. Briefing on the local environment: where we are going, who uses the place, who looks after it, and what lives there.",
   "i": "Explain the goals and the protocols for today’s fieldwork: a beach clean-up, or an audit of the school grounds or a park, to find out what needs looking after and to report it to the local board. Two jobs: collect and count the litter, and log every problem we spot. Teach social action, audit and data.",
   "w": "Establish the health and safety rules together from the safety slide, set the boundary, and give out the equipment and the group jobs: two collectors, a recorder and a safety officer.",
   "y": "Groups of four carry out the clean-up or audit. They tally what they find on the data sheet (Q1) and log each problem with who could fix it — the council or the community (Q2). Before they pack up they agree on what surprised them (Q3) and the exit ticket (Q4).",
   "r": "Gather the equipment, sort the rubbish for disposal, and wash or sanitise hands. Back in the classroom, students copy the two notes while recorders add up; groups call out their totals and hand the sheets in. Add the totals up on the board and type them into the tally on this page. If time runs out, the two notes can wait until the start of Lesson 12.",
   "res": "EOTC paperwork approved: risk assessment, adult-to-student ratio, permission, and the office told where you are. Start this in week one. Visit the site beforehand at the same time of day — and the same tide, for a beach. Set a boundary you can see all of. Gloves for everyone, rubbish bags and separate recycling bags, a bucket or tongs for adults to deal with glass, a first-aid kit, hand sanitiser and a phone. Print the data sheet (the Lesson 11 worksheet), one per group, and put each on a clipboard with a pencil. Tell students the day before: closed shoes, a sunhat and a water bottle. Decide where the collected rubbish will go, and have a wet-weather plan: the grounds audit works under cover. Allow for the walk. If the site is more than five minutes away, do the briefing slides at the end of Lesson 10 so the whole hour is free."
  },
  {
   "n": 12,
   "t": "Did it work? Evaluating our action",
   "strand": "Part",
   "k": "Evaluate social action.",
   "p": "Design, implement and evaluate social action: evaluate an initiative or action.",
   "c": "Display the raw data from the practical session: the class chart on the first slide, or the totals on the whiteboard. Ask: what did we find most of? What surprised you? Where do you think it came from?",
   "i": "Explain how to evaluate the success and the limitations of a social action, using the four questions on the slide: what did we do, what did it achieve, what could it not fix, and what should happen next? Teach evaluate, root cause and recommendation.",
   "w": "Together, answer: “Did our action fix the root cause of the problem?” Use the iceberg slide, then ask “why?” five times on the whiteboard, starting from “there was litter on the beach”. Agree on one root cause as a class. Two quiz questions.",
   "y": "Students copy the three notes, then write a one-page evaluation report of the fieldwork on the worksheet (Q1–Q7): what the group did and found, what the action achieved and could not fix, the root cause, two recommendations for the local board and one thing the community could do.",
   "r": "Each group shares one recommendation with the class. Collect the reports. Exit ticket in books.",
   "res": "Type the class totals from Lesson 11 into the tally on this run sheet, so the first slide shows the chart. No device? Write the totals on the whiteboard instead. Give the group data sheets from Lesson 11 back to their groups. Print the report (the Lesson 12 worksheet), one per student. Decide whether the class will really send its recommendations to the Waiheke Local Board — see the teaching notes."
  },
  {
   "n": 13,
   "t": "Changing a rule: vote, submit, protest",
   "strand": "Part",
   "k": "Active citizenship includes making submissions, respectful protest and voting.",
   "p": "Communicate findings and conceptual knowledge: describe forms of participation and how they bring change.",
   "c": "Ask: how do you change a rule you think is unfair? Start with a school rule, then widen it to the island. List every method students suggest on the board.",
   "i": "Outline the spectrum of civic action from the diagram: voting (formal), submissions (formal) and protest (informal, but protected by law). Teach vote, submission, protest and petition. Show why a vote counts with the 18-vote slide, and explain that peaceful protest is a right in New Zealand. Two quiz questions.",
   "w": "Analyse two local campaigns and their outcomes. First the plan for a marina at Matiatia, 2013 to 2015: tell the story from the two slides, then students sort eight actions into formal and informal (Q1) and answer the questions about Matiatia (Q2 and Q3). Then a historical protest across the water: the occupation of Bastion Point, 1977–78. Finish with the 2021 rāhui as a third way of acting; if you are short of time, that slide can wait.",
   "y": "Students copy the four notes, then draft a formal written submission to the Waiheke Local Board about a community issue they care about, using the frame on the worksheet (Q4).",
   "r": "Discuss the difference in impact between a submission and a protest, using the two-column slide. Exit ticket in books.",
   "res": "Print the Lesson 13 worksheet, one per student, double-sided. Read the note on the marina protests on the Start Here page before you teach this. If the class sent recommendations to the local board after Lesson 12, have them to hand: they are a real submission. Students can use their Lesson 2 questions or their Lesson 12 recommendations as the issue for their submission."
  },
  {

   "strand": "Informed",
   "k": "Local governments play a role in providing services, funded by specific means.",
   "p": "Process information: collect and classify information.",
   "c": "Show the big number: $5,133,000,000, what Auckland Council spent on running the city in one year. Ask: how do we make sense of a number like that? Take ideas, then give the trick — shrink it to $100.",
   "i": "Teach budget, percentage, revenue and expenditure. Explicitly teach how to read a spending pie graph and how to turn a percentage into a real amount: if 20% goes to transport, that is $20 out of every $100. Two quiz questions.",
   "w": "Break down the simplified budget graphs together. Graph A, the pie: which slice is biggest, which is smallest, what do two slices add up to? Graph B, the bars: where does the money come from? Link the bars back to rates, user charges and government funding in Lesson 5.",
   "y": "Students copy the three notes, then answer the twelve numeracy questions on the worksheet: Q1–Q6 from Graph A, the spending pie graph, and Q7–Q12 from Graph B, the income bar graph. Calculators allowed; working shown.",
   "r": "Self-mark from the two answer slides, in a different colour. Correct misunderstandings about percentages as they come up — Q5, Q10 and Q11 are where they show. Exit ticket in books.",
   "res": "Print the Lesson 14 worksheet, one per student, double-sided. The two budget graphs are printed on it. Calculators, one between two. A different-coloured pen for self-marking. Read the teaching note on where the figures come from, in case a student asks why water is on the graph."

  "7": [
   "Print the <strong>Lesson 7 worksheet</strong>, one per student, <strong>double-sided</strong>: the argument board is on the front, and the fact bank and paragraph plan are on the back.",

  "8": [

  "9": [
   "<strong>Choose your meeting.</strong> Either pick about three minutes of public input from the Auckland Council Live channel (see Links) or plan to read the worksheet script aloud. The viewpoint grid works for both.",

   "Print the <strong>role cards</strong>: three scenarios, one page each, four cards on a page. Each group of four needs one scenario, so for 28 students print two or three copies of each page and cut them up.",

   "Check that the <strong>websites on the worksheet</strong> open on the school network.",

  "11": [
   "<strong>EOTC paperwork approved</strong>: risk assessment, adult-to-student ratio, permission, and the office told where you are. Start this in week one.",
   "<strong>Visit the site</strong> beforehand at the same time of day — and the same tide, for a beach. Set a boundary you can see all of.",
   "<strong>Gloves for everyone</strong>, rubbish bags and separate recycling bags, a bucket or tongs for adults to deal with glass, a first-aid kit, hand sanitiser and a phone.",
   "Print the <strong>data sheet</strong> (the Lesson 11 worksheet), <strong>one per group</strong>, and put each on a clipboard with a pencil.",
   "Tell students the day before: <strong>closed shoes</strong>, a sunhat and a water bottle.",
   "Decide where the collected rubbish will go, and have a <strong>wet-weather plan</strong>: the grounds audit works under cover.",

  "12": [

  "16": [

 "notes": {
  "1": {
   "watch": "Many Year 7s think democracy only means voting, so it has nothing to do with them until they are 18. Keep saying “having a say”. If someone says the Prime Minister runs Waiheke, park it on the board — Lesson 3 sorts out who does what.",
   "support": "Let pairs share one concept map, or cut the word bank at the foot of the worksheet into labels to place. A drawing inside a bubble is fine.",
   "extend": "Ask for a line between every pair of bubbles, and for one link they are unsure of, marked with a question mark to come back to in Lesson 16.",
   "local": "Use island examples the class knows: the ferry queue, the Saturday market, the rāhui signs at the beach, the school gala."
  },
  "2": {
   "watch": "Year 7 “questions” are often complaints (“Why doesn’t the council just fix it?”) or solutions in disguise (“Can we get more bins?”). Ask: what would you need to find out first? Also watch for questions too big to investigate, like “Why is there pollution?”",
   "support": "The who, why and how starters are printed on the worksheet. Let students talk their challenge through with a partner before they write.",
   "extend": "Beside each question, write who would know the answer. Then rank the three by how easy they would be to investigate.",
   "local": "A real broken swing can be reported to Auckland Council on 09 301 0101 or online. That comes up properly in Lesson 4, but it is a good answer if someone asks “so what do you actually do?”"
  },
  "3": {
   "watch": "The commonest mix-up is thinking the local board <em>is</em> the council, or that the mayor runs Waiheke directly. Keep pointing at the diagram: two parts, one council. Students also put schools under the council because they are local buildings — schools are central government.",
   "support": "Do Q2 with the diagram slide still on the board. For the infographic, give a frame: a heading, five boxes, a picture and four words in each.",
   "extend": "Add a sixth box: one thing the council is <em>not</em> responsible for, and who is. Or find out which ward councillor represents Waiheke on the Governing Body.",
   "local": "Talk to your kaiako Māori before teaching the mana whenua slide. The site says only that the council has a legal duty to involve Māori in decisions and that the board’s relationships include Ngāti Pāoa; other iwi also have interests in Waiheke and the Gulf. The board’s office is at 10 Belgium Street, Ostend — students may have walked past it."
  },
  "4": {
   "watch": "Students assume anything public is the council’s: schools (central government) and the ferry (a private company) are the usual two. They also assume “council” means free. The transfer station is the council’s and still charges — which sets up Lesson 5.",
   "support": "Read Mia’s story aloud first while students follow with a finger, then let them highlight in pairs. Ten services is the target; six is a fair start.",
   "extend": "Rewrite two sentences of Mia’s day as if the council stopped work for a month. What would she see?",
   "local": "Most Waiheke homes collect rainwater and treat their own wastewater; only part of Oneroa is on a public wastewater scheme. In the city, council-owned Watercare pipes water in and wastewater out, and households pay a water bill. The Ostend transfer station is a council facility run under contract by a local organisation — check the current arrangement if a student asks. Roads changed hands on 1 October 2026: Auckland Council now looks after roads, footpaths and street lights itself, and Auckland Transport only runs buses, trains and ferries."
  },
  "5": {
   "watch": "Students think only rich people pay rates, or that renters pay nothing. Rates are part of what a landlord charges, so nearly every household pays. In the sum, the common slip is multiplying the whole value by 3 instead of counting the thousands first.",
   "support": "Do Property A together on the board and leave the working up. Give the “thousands” column for B and C: 1,000 and 1,280.",
   "extend": "A property is worth $2 million. What is the bill? ($6,500.) What value gives a bill of exactly $2,000? ($500,000.)",
   "local": "The formula is made up so Year 7s can do it: $500 plus $3 for every $1,000 of value. It is tuned to be realistic — the average-value Auckland home ($1.28 million) comes out at $4,340, and the real 2026/27 average is $4,378. Real bills have a fixed charge, a value-based rate and several targeted rates."
  },
  "6": {
   "watch": "Students think anything in a newspaper is a fact, and that any sentence with a number in it must be one (“a shocking 7.9 per cent” is an opinion wrapped round a fact). The reverse trap: “it is a fact that I think…”. Keep to the test — could someone check it?",
   "support": "Do the first four sentences of Article B together, or give Article B with the six facts already marked so the task becomes finding emotive words.",
   "extend": "Rewrite the made-up headline so it gives the same news with no emotive words. Then compare the real headlines in Links: which one is trying hardest to make you feel something?",
   "local": "The $6.16 a week in Article A is the council’s own figure. $321 ÷ 52 comes to $6.17, because $321 is itself rounded — a good catch if a student makes it. Article B is a letter from an islander, and its points about rain tanks and the City Rail Link are ones students may have heard at home. That is the point: an argument can use true facts and still be one-sided. Lesson 7 hears the other side properly."
  },
  "7": {
   "watch": "The room will lean one way — usually against the rise. Make sure the other side gets a fair hearing: ask a student to argue the side they did not choose. In the writing, the common gap is opinion with no fact, or facts with no link to the reason.",
   "support": "The worksheet plan (Q2) is a sentence frame. A student who needs it can write full sentences in the five boxes and copy them out as the paragraph. Allow a spoken rehearsal with a partner first.",
   "extend": "Write the paragraph for the side you disagree with, as fairly as you can. Or add a sentence that says what you would cut, or what you would charge for, instead.",
   "local": "Keep it about arguments, not families. Lesson 6’s made-up letter gave an islander’s case against the rise; today the other side gets equal time. The rates cap is live politics — the links include the Government’s case, the councils’ reply and one opinion piece, and the slide stays neutral."
  },
  "8": {
   "watch": "In Q6 the usual slip is multiplying $700,000 by 3. Give the method mark for “+ $500” even if the first step is wrong. In Q9, many students give an opinion and stop: the marks are for the reason, the fact and the other side.",
   "support": "A reader can read any question aloud; a writer can scribe Q7 and Q9. Section A can be done with the word-wall cards on the desk if you are assessing the later sections only.",
   "extend": "Early finishers write one more test question for Section A or C on the back, with its answer.",
   "local": "Suggested bands are on the Assessment tab: 0–11 not yet, 12–19 Achieved, 20–25 Merit, 26–30 Excellence. Adjust them to your department’s practice."
  },
  "9": {
   "watch": "Role play goes wrong when the “residents” perform an argument instead of making a case. The chair’s card has the rules; back the chairs up. Students also think the loudest speaker wins — point out that the board in the script thanked all three and decided later.",
   "support": "Give the chairperson card to a student who will enjoy holding the group to the rules. Residents may read their card aloud as their one minute. A group of five can have two people share a role.",
   "extend": "After the decision, residents swap cards and argue the opposite view for one minute. Or write the three-minute speech you would give at a real public forum.",
   "local": "The script and the role cards are made up: Kōwhai Bay and Kōwhai Reserve are not real places. The meeting details are real — Waiheke Local Board business meetings are usually on the fourth Wednesday at 1pm, anyone can speak for three minutes in the public forum, and a booked deputation gets up to ten. A class visit to a meeting, or a board member visiting the class, is worth asking for."
  },
  "10": {
   "watch": "Students think “civic responsibility” means rules and rubbish, so a festival does not count. Ask who feeds the performers, drives the vans, sews the costumes and runs the gate. Posters also drift into advertising with no civic value on them — hold them to the Q3 sentence.",
   "support": "Pair students on one device and one initiative. Give the Q2 notes as questions to ask aloud while a partner reads the website.",
   "extend": "Find out how the group is paid for: a local board grant, donations, or volunteers’ time? The OurAuckland grants article in Links names several. That connects back to Lesson 5.",
   "local": "Students will know groups that are not on the list — a sports club, a marae committee, kapa haka, the surf club, a church. Let them choose their own if they can find out enough to fill in Q2. Every group on the worksheet was checked as active in 2026; the fire brigade has no website of its own, so that one needs a search."
  },
  "11": {
   "watch": "Groups race to fill bags and forget to count. Counting is the point: without data there is nothing to evaluate in Lesson 12. Recorders should tally as each item goes into the bag. Watch too for “the council should fix everything” — Q2 makes them choose.",
   "support": "Give the recorder job to a student who is not keen on handling rubbish. Pair a confident counter with a recorder who needs help.",
   "extend": "Photograph or sketch-map where the most litter was found. Is it near the car park, the bins, the stream mouth? That is evidence about the root cause for Lesson 12.",
   "local": "A Hauraki Gulf beach makes the strongest lesson, but the school grounds or the nearest reserve teach the same skills with far less paperwork. Sustainable Coastlines’ Litter Intelligence programme takes school groups and uses a United Nations survey method — worth applying for if you want to repeat this as real citizen science."
  },
  "12": {
   "watch": "Students write “it worked, we picked up heaps” and stop. Push on the limit: will the litter be back next week? They also offer solutions as root causes (“there should be more bins” is a recommendation; “the bin overflows by Saturday” is a cause).",
   "support": "The report is a frame with a starter for each box. Let students write Q1 and Q2 with their fieldwork group and the rest alone.",
   "extend": "Turn the two recommendations into a real letter or a three-minute public-forum speech for the Waiheke Local Board. Use the board’s email in Links, or book a deputation as a class.",
   "local": "The slides talk about litter on a beach. If you did a grounds or park audit, swap in your own place and your most common problem. Sending the recommendations for real is the best ending this lesson can have, and it leads straight into Lesson 13. If you do, send the class data with them. The four-tick marking guide for this report is on the Assessment tab."
  },
  "13": {
   "watch": "Students think protest is the only way to be heard, or that it is always illegal. Peaceful protest is a right; blocking, damaging or threatening is not. They also think a submission is a complaint — it is a request with reasons.",
   "support": "The submission frame has a starter for every part. A student can base it on a scenario card from Lesson 2 if they have no issue of their own.",
   "extend": "Look at the 2019 school climate strikes, organised by students aged 12 to 18: what did they want, and did they get it? Or watch part of the Bastion Point documentary in Links and add to the class picture of what protest can and cannot do.",
   "local": "You will also see Matiatia written Mātiatia; the group’s name and the court decision do not use the macron. Matiatia was chosen because the outcome is clear and it was settled through formal processes. Bastion Point (Takaparawhau) is the protest example: students pass it on the ferry, the facts are well documented, and the outcome is known. It is also the story of Ngāti Whātua Ōrākei losing and regaining their land, so teach it with care and talk to your kaiako Māori first. The Kennedy Point / Pūtiki Bay marina is the comparison many islanders will think of: a long protest occupation in 2021, arrests, and a marina that opened in 2023 anyway. Raise it only if you know your class — families may have been on either side. The rāhui slide says what public sources say and no more; talk to your kaiako Māori first."
  },
  "14": {
   "watch": "The big one: reading a percentage as a dollar amount, or the other way round. Keep saying “out of every hundred”. Students also add figures across the two graphs — they are two different hundreds, one of spending and one of income. In Q11, some will write $4,010: they have added 10 dollars, not 10 per cent.",
   "support": "Stay with the $100 version for every question: imagine one $100 note being shared out. Q5 and Q10 can be done by doubling or by “times ten”. Give Q12 as a sentence starter: “Transport is the biggest slice because…”",
   "extend": "The real total was $5,133 million. Work out what the council actually spent on transport (33% is about $1,694 million; the real figure was $1,705 million). Why is the answer slightly out? Because the percentages were rounded.",
   "local": "The graphs come from Auckland Council’s Annual Plan 2025/2026 and are rounded so each adds up to exactly $100. The council’s own headings are Transport, Water, Community, Natural environment, Well-managed local government, Economic and cultural development, and Built environment; three have been renamed for Year 7. Most Waiheke homes do not use the council’s water pipes, and in the city water is largely paid for through water bills — a user charge — so the Water slice is a good place to ask “do islanders pay for this?”"
  },
  "15": {
   "watch": "Students think false information is always deliberate, and that they personally would never fall for it. The post is built to feel true — it uses a real worry, rates. They also think adding “not sure if this is true” makes sharing fine; it still spreads it.",
   "support": "Do Q1 as a class on the slide. For Q4, give the first check — “Stop. Do I feel angry or scared?” — and let students add four.",
   "extend": "Rewrite the fake post as an honest one: same topic, true figure, a named source, no capital letters. Which version would be shared more, and what does that tell you?",
   "local": "Rumours travel fast on an island, and community pages are where many families get their news. Keep examples general and never use a real local post or a real person. The fake post accuses “the people in charge” of “pocketing the money”: that is there on purpose, to show how false claims hurt real people. It names no real page and no real person."
  },
  "16": {
   "watch": "Topic choice makes or breaks the assignment. “Pollution”, “climate change” and “the ferries” are too big, or not something a council or community can act on. The test is on the slide: local, specific, real, and someone could do something about it. On the map, watch for new bubbles with no words on the lines.",
   "support": "Offer the topic list on the slide, or a Lesson 2 scenario card turned into a real place. For the concept map, give five words that must go on: local board, rates, submission, fact, volunteer.",
   "extend": "On the concept map, find a link that crosses the whole unit — for example from “rates” to “submission”. For the topic, choose one where the responsibility is unclear and working that out is part of the project.",
   "local": "Real island issues make the best projects: a crossing near a school, dogs and dotterels on a named beach, a footpath that stops, somewhere for young people to go after school. If a student wants a topic that is close to home for another family in the class, have a quiet word."
  },
  "17": {
   "watch": "Students copy whole sentences from websites, or collect opinions and call them facts. The source log asks “fact or opinion?” for every entry. Also watch Q3: “the council” is not enough for Merit — which part?",
   "support": "An interview counts as a source: a parent, a neighbour, the school caretaker, a shop owner. For some students two interviews and one website is a complete research phase. Sit with the “see me first” group while they narrow their topic.",
   "extend": "Find a source that disagrees with what you think, and log it fairly. Or find out how much the fix would cost and where the money would come from.",
   "local": "Good places to look: the Waiheke Local Board’s page and OurAuckland for decisions and grants, Gulf News for local debate, AK Have Your Say for open consultations, and people who use the place. Students researching a named place should go and look at it if they safely can."
  },
  "18": {
   "watch": "The big ideas get dropped in as decoration: “This is democracy.” Ask “because…?” every time. Section 3 often turns into the student’s own opinion twice; it needs two other people’s views. Section 4 is often a wish (“the council should fix it”) and not an action the student could take.",
   "support": "The drafting frame gives sentence starters for every section. A student who completes the starters has an Achieved-level draft to build on. Scribing or voice typing is fine: the thinking is what is assessed.",
   "extend": "For Excellence in Section 4, weigh the action against another option: why a submission and not a petition? And say what it would not fix — the Lesson 12 skill.",
   "local": "If a student’s action is real and ready — a submission, a report to the council, three minutes in the public forum — help them do it. A project that ends in a real action is the point of the unit."
  },
  "19": {
   "watch": "Students tick the whole checklist without looking. Ask them to put a finger on the evidence for one tick. The self-assessment (Q2) is worth reading: a student who circles Excellence everywhere, or Achieved everywhere, has not read the rubric.",
   "support": "Proofread in pairs: one reads aloud, the other follows with a pencil. A student who is not finished hands in what they have with the checklist honest about what is missing; agree a time to complete it.",
   "extend": "Finished early? Carry out the action in Section 4 for real, or turn the project into a three-minute talk for the class.",
   "local": "Keep three or four projects, with permission, as examples for next year. Any real submissions or reports that came out of the assignment are worth telling the local board about."
  }
 },
 "bookwork": {

   "ans": "Infographic: any five of the eight responsibilities on the slide — parks and playgrounds; libraries; rubbish and recycling; water, wastewater and stormwater; planning local roads and footpaths; deciding where houses can be built; relationships with iwi; working with businesses and the community. Each needs a picture and a label."

    "A user charge is a fee you pay only when you use a service, like dumping rubbish at the transfer station.",
    "Government funding is money that central government gives to a council, out of the taxes everyone pays.",
    "The council works out the rates for each property from its property value, so a more valuable property pays more."

   "check": "Four notes and the exit ticket."

    "A fact is something that can be checked and proved true. A statistic is a fact given as a number.",
    "An opinion is what someone thinks, feels or believes. It cannot be proved.",
    "Emotive language is words chosen to make the reader feel something, such as “shocking” or “greedy”.",
    "Bias means leaning towards one side, or showing only one side. Informed citizens check whether what they read is fact or opinion."
   ],
   "check": "Four notes, and a labelled fact and opinion as the exit ticket."
  },
  "7": {
   "copy": [
    "An argument is a reason given to support a point of view. Evidence is facts or examples that back up what you say.",
    "One side of the rates debate says rates must rise to keep public services such as libraries, parks and buses going.",
    "The other side says rates rises cost households too much, so the council should spend less.",
    "People campaign on both sides. In 2026 the Government announced a rates cap: a limit on how much councils can raise rates each year."
   ],
   "check": "Four notes, a persuasive paragraph with two underlined facts, and the exit ticket.",
   "ans": "Paragraph: look for a clear position in the first sentence, two reasons, at least two underlined facts from the fact bank that fit the reasons, and a sentence that answers the other side. Either side can earn full credit."
  },
  "9": {
   "copy": [
    "Citizens take part informally by noticing problems, talking with others and turning up to listen. They take part formally by speaking at a meeting, making a submission or voting.",
    "At a public forum, anyone can speak to the local board for a few minutes. At Waiheke Local Board meetings each speaker gets three minutes.",

  "10": {
   "copy": [

 "resourceNotes": {
  "1": "The unit plan suggests searching “Civics and citizenship education New Zealand overview”. The Ministry’s 2020 <em>Civics and Citizenship Education Teaching and Learning Guide</em> used to be the answer, but its link was dead in October 2026 and no new home was found.",
  "3": "The unit plan’s search prompts for this lesson were “Waiheke Local Board role Auckland Council” and “Auckland Council relationship with Māori iwi”. The Waiheke Local Board page and the Kaupapa Māori page above are where those lead.",
  "4": "The unit plan’s search prompt was “What does Auckland Council do for students”. No page by that name was found; the Vote Auckland list above is the closest fit for this age.",
  "5": "The unit plan’s search prompt was “How are rates calculated Auckland Council”. The first two links above are the plainest answers found.",
  "6": "The unit plan’s search prompt was “News article Auckland Council rates rise debate”. The lesson’s two articles are made up so they can be printed freely and pitched at Year 7; the real coverage above is for you, and for extension. RNZ and the NZ Herald also covered the vote, but their pages could not be opened to check.",
  "7": "The unit plan lists a “debate framework template” as the resource for this lesson. Worksheet Q1 (the argument board) and Q2 (the paragraph plan) are that template.",
  "9": "The unit plan asks for a short video of a community board meeting, with the search prompt “Auckland Council local board meeting video snippet”. No recording of a Waiheke Local Board meeting could be linked: the board’s page mentions recordings, but the link could not be opened. The board’s email is waihekelocalboard@aucklandcouncil.govt.nz if you want to ask for one. The printed script is there so the lesson does not depend on a clip.",
  "10": "The unit plan’s search prompt was “Community garden initiatives New Zealand”. Home Grown Waiheke is the island’s own answer. Piritahi Marae and the Waiheke Recreation Centre are also active, but their own websites could not be opened to check, so they are not on the student list.",
  "11": "No Sustainable Coastlines event on Waiheke was found for 2025–26, so this lesson is written as your own class action. Follow your school’s EOTC process — nothing on this page replaces it.",
  "12": "The unit plan lists “evaluation report templates” as the resource for this lesson. The Lesson 12 worksheet is that template.",
  "13": "The unit plan’s search prompt was “How to make a submission to local council NZ”; AK Have Your Say is where that leads in Auckland. The plan asks for “a historical local protest, for example protecting local trees or beaches” — Matiatia is the island’s clearest example with a known outcome.",
  "14": "The unit plan’s search prompt was “Auckland Council budget breakdown graph”. The council’s own graphs are in the links; the two on the worksheet were redrawn from the same figures and rounded so that Year 7s can work in whole dollars out of $100.",
  "15": "The unit plan asks for “examples of misinformation (safe, teacher-generated)”. The post on the worksheet and the slide is that example: made up, about no real page or person, and labelled.",
  "16": "The unit plan lists “assignment rubrics” and “original concept maps from L1” as the resources for this lesson. The rubric is on the back of the task sheet and on the Assessment tab; the concept maps are in your Lesson 1 folder."
 },

  "valuation": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"A made-up property valuation notice for 12 Example Road, Waiheke Island: property value 800,000 dollars. Beside it, the classroom rates formula.\" style=\"width:100%;height:auto;display:block\"><rect x=\"20\" y=\"20\" width=\"400\" height=\"290\" rx=\"4\" fill=\"#fcfcfa\" stroke=\"#475569\" stroke-width=\"2\"/><rect x=\"20\" y=\"20\" width=\"400\" height=\"46\" fill=\"#002066\"/><text x=\"220\" y=\"50\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">PROPERTY VALUATION NOTICE</text><text x=\"40\" y=\"98\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"start\">Address:</text><text x=\"140\" y=\"98\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"start\" font-weight=\"bold\">12 Example Road, Waiheke Island</text><text x=\"40\" y=\"132\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"start\">Land:</text><text x=\"140\" y=\"132\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"start\">$500,000</text><text x=\"40\" y=\"164\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#475569\" text-anchor=\"start\">Buildings:</text><text x=\"140\" y=\"164\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"start\">$300,000</text><line x1=\"40\" y1=\"182\" x2=\"400\" y2=\"182\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text x=\"40\" y=\"216\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#0f172a\" text-anchor=\"start\" font-weight=\"bold\">Property value:</text><text x=\"400\" y=\"220\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"28\" fill=\"#002066\" text-anchor=\"end\" font-weight=\"bold\">$800,000</text><text x=\"220\" y=\"262\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"middle\" font-style=\"italic\">The council uses this value to work out the rates.</text><text x=\"220\" y=\"292\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" fill=\"#8b6508\" text-anchor=\"middle\" font-weight=\"bold\">Made up for this lesson — not a real property.</text><text x=\"680\" y=\"46\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#8b6508\" text-anchor=\"middle\" font-weight=\"bold\">OUR CLASSROOM RATES FORMULA</text><rect x=\"480\" y=\"64\" width=\"400\" height=\"62\" rx=\"8\" fill=\"#eef4fb\" stroke=\"#002066\" stroke-width=\"2\"/><text x=\"680\" y=\"92\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#475569\" text-anchor=\"middle\">Fixed charge</text><text x=\"680\" y=\"116\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">$500 for every property</text><text x=\"680\" y=\"156\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"30\" fill=\"#002066\" text-anchor=\"middle\" font-weight=\"bold\">+</text><rect x=\"480\" y=\"168\" width=\"400\" height=\"62\" rx=\"8\" fill=\"#eef4fb\" stroke=\"#002066\" stroke-width=\"2\"/><text x=\"680\" y=\"196\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"15\" fill=\"#475569\" text-anchor=\"middle\">Value charge</text><text x=\"680\" y=\"220\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">$3 for every $1,000 of value</text><text x=\"680\" y=\"260\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"30\" fill=\"#002066\" text-anchor=\"middle\" font-weight=\"bold\">=</text><rect x=\"480\" y=\"268\" width=\"400\" height=\"44\" rx=\"8\" fill=\"#002066\" stroke=\"#002066\" stroke-width=\"2\"/><text x=\"680\" y=\"297\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"18\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\   "headline": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 400\" role=\"img\" aria-label=\"A made-up newspaper front page with the headline: Rates shock — council’s greedy grab hits families again\" style=\"width:100%;height:auto;display:block\"><rect x=\"30\" y=\"16\" width=\"840\" height=\"368\" rx=\"2\" fill=\"#fcfcf7\" stroke=\"#111\" stroke-width=\"2\"/><text x=\"450\" y=\"62\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"34\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">THE ISLAND TIMES</text><line x1=\"50\" y1=\"78\" x2=\"850\" y2=\"78\" stroke=\"#111\" stroke-width=\"3\"/><line x1=\"50\" y1=\"84\" x2=\"850\" y2=\"84\" stroke=\"#111\" stroke-width=\"1\"/><text x=\"50\" y=\"104\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#8b6508\" text-anchor=\"start\" font-weight=\"bold\">Made up for this lesson — not a real newspaper</text><text x=\"850\" y=\"104\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"end\">FREE</text><text x=\"450\" y=\"176\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"58\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">RATES SHOCK:</text><text x=\"450\" y=\"238\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"50\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">COUNCIL’S GREEDY GRAB</text><text x=\"450\" y=\"296\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"50\" fill=\"#0f172a\" text-anchor=\"middle\" font-weight=\"bold\">HITS FAMILIES AGAIN</text><text x=\"450\" y=\"340\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"21\" fill=\"#475569\" text-anchor=\"middle\" font-style=\"italic\">Furious locals say enough is enough as bills soar</text><line x1=\"50\" y1=\"358\" x2=\"850\" y2=\"358\" stroke=\"#111\" stroke-width=\"1\"/></svg>",

  "spectrum": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"Three ways citizens can change a decision: vote (formal), make a submission (formal), protest (informal but protected by law)\" style=\"width:100%;height:auto;display:block\"><text x=\"450\" y=\"40\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#002066\" text-anchor=\"middle\" font-weight=\"bold\">How can citizens change a rule or a decision?</text><line x1=\"60\" y1=\"76\" x2=\"820\" y2=\"76\" stroke=\"#94a3b8\" stroke-width=\"4\"/><polygon points=\"840,76 818,66 818,86\" fill=\"#94a3b8\"/><text x=\"60\" y=\"60\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"start\" font-weight=\"bold\">FORMAL — a set process</text><text x=\"800\" y=\"60\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"13\" fill=\"#475569\" text-anchor=\"end\" font-weight=\"bold\">INFORMAL — people decide how</text><rect x=\"30\" y=\"96\" width=\"260\" height=\"190\" rx=\"8\" fill=\"#fff\" stroke=\"#1d4ed8\" stroke-width=\"3\"/><rect x=\"30\" y=\"96\" width=\"260\" height=\"46\" rx=\"8\" fill=\"#1d4ed8\"/><text x=\"160\" y=\"127\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"22\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"bold\">VOTE</text><text x=\"160\" y=\"172\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\" fill=\"#1d4ed8\" text-anchor=\"middle\" font-weight=\"bold\">FORMAL</text><text x=\"160\" y=\"208\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">Choose who makes</text><text x=\"160\" y=\"232\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"16\" fill=\"#0f172a\" text-anchor=\"middle\">the decisions</text><rect x=\"320\" y=\"96\" width=\"260\" height=\"190\" rx=\"8\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><rect x=\"320\" y=\"96\" width=\"260\" height=\"46\" rx=\"8\" fill=\"#0f766e\"/><text x=\"450\" y=\"127\   "testNote": "<p>Thirty marks in four sections, about 30 minutes: <strong>A</strong> key words (8), <strong>B</strong> who runs Waiheke and what the council does (8), <strong>C</strong> who pays, including one rates sum (6), <strong>D</strong> fact, opinion and the rates debate (8). It covers Lessons 1–7 only.</p><p>The unit plan asks the teacher to prepare the questions; this paper is a full draft for you to edit. It sits in the page source like everything else, but students never see this site. Suggested bands, to adjust to your department’s practice: <strong>0–11</strong> not yet · <strong>12–19</strong> Achieved · <strong>20–25</strong> Merit · <strong>26–30</strong> Excellence.</p>",
  "brief": "<p>Each student chooses a <strong>local issue</strong>, finds out <strong>who is responsible</strong> for it and how it is paid for, sets out <strong>two points of view</strong>, and proposes an <strong>active-citizenship response</strong>. The finished project has four short sections and a source list, presented as a booklet, a poster or a slideshow — the student’s choice. About 350 to 500 words in all.</p><p>It is individual work over four lessons: Lesson 16 briefing, rubric and topic choice; Lesson 17 research and planning; Lesson 18 drafting; Lesson 19 finishing and handing in. Each lesson has its own page in the student pack.</p><p><strong>This is a draft for you to adapt.</strong> The unit plan describes the assignment in one sentence and leaves the task sheet and rubric to the teacher. Change the length, the format or the bands to suit your class.</p>",

 "planIntro": "<strong>This sequence follows the WHS Year 7 Civics and Society unit plan</strong> — 16 core lessons in the Connect / I Do / We Do / You Do / Review structure, plus three assessment lessons, each 60 minutes. Every lesson names what goes in the exercise book, what is on the printed worksheet, what is done with cut-up cards and what is done together off the slides, and the same list is on the task slide of every deck. Students do not use this site: the plan’s sorting and matching tasks are on worksheets, card sets or slideshow quizzes.",
 "teacherWarnings": [
  "<strong>This site is for teachers only.</strong> There is no passcode, and the answers, the test and the marking rubric are one click from every lesson. Do not post the link or the file where students can reach it, and close the Answers section before you mirror your screen.",
  "<strong>Council facts go out of date.</strong> Rates and budgets change every July, and the people change at each election (the next is 2028). The figures here were correct in October 2026: a 7.9% rates rise for 2026/27, an average bill of $4,378, and a five-member Waiheke Local Board chaired by Kylee Matthews. Check the Fact File links before you quote any of them as current. The board members’ names come from a secondary source and the council’s news site, not the board’s own page — confirm them there. <strong>Roads changed hands on 1 October 2026:</strong> Auckland Council now looks after roads, footpaths and street lights, local boards decide about local streets and parking, and Auckland Transport only runs buses, trains and ferries. The site is written for that, but older links and resources will still say Auckland Transport.",
  "<strong>Waiheke is not like the rest of Auckland (Lesson 4).</strong> Most island homes collect rainwater in tanks and treat their own wastewater in septic systems; only part of Oneroa is on a public wastewater scheme. The usual “the council pipes water to your house” story is wrong for most of your class. The lesson is written around that, and it makes a good discussion: what does the council still provide here?",
  "<strong>Rates are close to home (Lessons 5–7).</strong> Some students’ families own property, many rent, and some are finding the cost of living hard. Keep it to the arguments and the evidence, and never ask a student what their family pays.",
  "<strong>The marina protests are closer still (Lesson 13).</strong> The lesson’s worked example is the Matiatia marina (2013–2015), which ended in the Environment Court. The Kennedy Point / Pūtiki Bay marina (protest occupation 2021, marina opened 2023) is offered only as an optional comparison in the teaching notes: it involved arrests, it divided the island, and families in your class may have been on either side.",
  "<strong>Ngāti Pāoa and mana whenua (Lessons 3 and 13).</strong> The unit plan asks for the Waiheke Local Board’s relationship with Ngāti Pāoa to be taught. The site says only what public sources say: that the council has legal duties to involve Māori in decisions, and that Ngāti Pāoa placed the 2021 rāhui and asked the Government to back it in law. Other iwi also have interests in the island and the Gulf. No statement is attributed to any iwi. Lesson 13 also uses the 1977–78 occupation of Bastion Point, from NZHistory, as its example of protest. Talk to your kaiako Māori before you teach these lessons.",
  "<strong>Preview every video.</strong> Each YouTube link was confirmed by title and channel in October 2026, but none was watched right through and running times were not confirmed. The “watch for” prompts were written to fit what the titles promise — adjust them once you have watched. Videos do not play inside the slideshow when the file is opened straight from your computer; the play button opens YouTube instead.",
  "<strong>Lesson 9 needs a clip you choose.</strong> No recording of a Waiheke Local Board meeting could be linked. The lesson gives you the Auckland Council Live channel to pick three minutes from, and a printed meeting script to read aloud if you would rather not use video.",
  "<strong>Some materials are made up, and say so.</strong> The two news articles and the front page (Lesson 6), the valuation notice and rates formula (Lesson 5), the role-play scenarios (Lesson 9) and the social-media post (Lesson 15) were written for this unit so they can be printed freely and pitched at Year 7. They use real figures, and every printed sheet and slide that carries one says “made up for this lesson”. The 10% rates rise debated in Lesson 7 is made up too, and says so. Links to real coverage are in each lesson’s Links section.",
  "<strong>Lesson 11 is fieldwork.</strong> A beach clean-up or a grounds audit needs your school’s EOTC process: a risk assessment, adult ratios, permission, a tide check for a beach, and gloves for everyone. The safety slide is a briefing, not a health and safety plan.",
  "<strong>The assessments are drafts.</strong> The unit plan leaves the test questions, the assignment task sheet and the rubric to the teacher. What is here is complete and ready to print, and it is yours to change.",
  "<strong>What needs the internet.</strong> The page’s fonts and styling, the videos, and the PowerPoint download (it fetches a small builder the first time). Everything else — slideshows, worksheets, card sets, answer keys — works offline once the page has loaded."
 ],
 "teacherSections": [
  {
   "title": "Knowledge and practices",
   "body": "<p><strong>Knowledge.</strong> Democracies depend on active participation by people taking civic responsibility in local communities, informally and formally (Lessons 1, 2, 9, 10, 13). Local governments make local decisions and provide services and resources, paid for by rates, user charges and government funding (Lessons 3, 4, 5, 14). Local councils are elected and are responsible for parks, playgrounds, water, libraries, rubbish, road planning, housing zones, and relationships with local iwi, businesses and the wider community (Lessons 3, 4). There is debate about rates rises, between those who say they are needed to keep public services going and those who want to restrict council spending (Lessons 6, 7). People show civic responsibility socially and culturally — Polyfest, Te Matatini, community gardening, volunteering (Lesson 10). Informed and active citizenship includes noticing, listening, attending meetings, volunteering, making submissions, respectful protest and voting (Lessons 9, 11, 12, 13). Informed citizenship includes thinking critically about sources, telling fact from opinion, and sharing information ethically (Lessons 6, 15).</p><p><strong>Practices.</strong> Think conceptually (L1, L3, L5, L8, L16) · frame questions (L2) · process information (L4, L6, L7, L14, L15) · identify values and perspectives (L9) · communicate findings and conceptual knowledge (L10, L13) · design, implement and evaluate social action (L11, L12) · all practices applied in the assignment (L17–19).</p><p><strong>Connections.</strong> Builds on Year 6 understandings of community roles and rules. Prepares students for Year 8–10 work on national government, Te Tiriti o Waitangi in legislation, and human rights — including the Year 10 unit “Small Country, Big Table”.</p>"
  },
  {
   "title": "Curriculum integration",
   "body": "<p><strong>Literacy.</strong> Explicit teaching of fact versus opinion in local media (Lesson 6, tagged Literacy), and of formal persuasive writing about council spending using civic vocabulary (Lesson 7). Lesson 13 adds a formal submission and Lesson 18 a formal tone and a source list. Lessons 1–7 and 9–15 have notes to copy, and every lesson except the test has an exit ticket.</p><p><strong>Numeracy.</strong> Reading a pie graph and a bar graph of a council budget and turning percentages into dollars out of $100 (Lesson 14, tagged Numeracy); working out a simplified rates bill from a property value (Lesson 5); tallying and totalling fieldwork data (Lessons 11 and 12).</p><p><strong>Key competencies.</strong> Participating and contributing through the planned social action (Lessons 11 and 12) and the meeting role play (Lesson 9). Thinking through the critical reading of media (Lessons 6 and 15) and of differing views on council funding (Lesson 7).</p><p><strong>Localised curriculum — Waiheke.</strong> The Waiheke Local Board and Auckland Council are the case study for local government throughout. Lessons tagged Waiheke: Lesson 3 (who runs the island, and the board’s relationships with mana whenua), Lesson 11 (fieldwork on a local beach, park or the school grounds) and Lesson 13 (the Matiatia marina, Bastion Point and the Ngāti Pāoa rāhui). Lesson 10 uses island groups; the Hauraki Gulf runs through Lessons 11–13.</p><p><strong>Status of the curriculum.</strong> The knowledge and practices above are the ones written into the WHS unit plan. The refreshed social sciences learning area for Years 0–10 was released in final form in August 2026 for use from 2027 — check the plan’s wording against it when the unit is next reviewed.</p>"

<div id="deck" class="no-print" role="dialog" aria-modal="true" aria-label="Lesson slideshow">
    <div id="deck-stage" onclick="if(event.target.closest('a,button,iframe'))return;deckNext()"></div>
    <div id="deck-notes" class="hidden"></div>
    <div id="deck-bar">
        <span id="deck-lesson"></span>
        <span id="deck-phase" class="t-ph"></span>
        <span id="deck-modes" aria-label="Where the work on this slide happens"></span>
        <span class="spacer"></span>
        <span id="deck-hint"></span>
        <button class="deck-btn" onclick="deckPrev()" aria-label="Previous slide">&#8249;</button>
        <span id="deck-count"></span>
        <button class="deck-btn" onclick="deckNext()" aria-label="Next slide">&#8250;</button>
        <span class="spacer"></span>
        <button id="deck-timer" class="deck-btn" onclick="deckTimerToggle()" title="Start or stop a countdown for this phase (T)">&#9201;</button>
        <button id="deck-notes-btn" class="deck-btn" onclick="deckToggleNotes()" title="Teacher notes (N) &#8212; these are visible on the projector">Notes</button>
        <button class="deck-btn" onclick="deckFullscreen()" title="Fullscreen (F)">Fullscreen</button>
        <button class="deck-btn" onclick="closeDeck()" title="Exit (Esc)">Exit</button>
    </div>
    <div id="deck-progress-track"><div id="deck-progress" style="width:0%"></div></div>
</div>
